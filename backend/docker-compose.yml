services:
  backend:
    # Build from the REPOSITORY ROOT: the image also bakes in
    # the evaluation corpus backend/data/corpus/ (inbox + attachments).
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Override with your own .env — never commit real secrets.
      ENVIRONMENT: development
      CORS_ORIGINS: "*"
      DATA_SOURCE: /app/data
      AI_PROVIDER: rule
    restart: unless-stopped
