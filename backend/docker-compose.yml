services:
  backend:
    # Build from the REPOSITORY ROOT — the image also bakes in
    # sdoc-hackathon-bundle/ (inbox + attachments), which lives one level up.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Override with your own .env — never commit real secrets.
      ENVIRONMENT: development
      CORS_ORIGINS: "*"
      DATA_SOURCE: /app/data
      AI_PROVIDER: rule
    restart: unless-stopped
