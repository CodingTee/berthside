<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulated Gmail · ShipSync</title>
<style>
:root{
  --bg:#f6f8fc; --panel:#fff; --line:#e0e3e9; --line-soft:#eceff4;
  --text:#202124; --muted:#5f6368; --muted-2:#80868b;
  --blue:#1a73e8; --blue-soft:#d3e3fd; --blue-hover:#e8f0fe;
  --green:#188038; --green-soft:#ceead6; --red:#d93025; --amber:#ea8600;
  --amber-soft:#fef7e0; --red-soft:#fce8e6;
  --side:#0f172a; --side-2:#131f36; --side-line:#26344f;
  --side-text:#e5edf8; --side-muted:#94a3b8;
  --teal:#2dd4bf; --sky:#38bdf8; --indigo:#6366f1;
  --sans:Arial,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit}

/* ---------------- top bar ---------------- */
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px}
.hamburger{border:0;background:none;cursor:pointer;padding:8px;border-radius:50%;display:grid;place-items:center}
.hamburger:hover{background:#f1f3f4}
.hamburger i{display:block;width:18px;height:2px;background:var(--muted);margin:2px 0;border-radius:2px}
.logo{display:flex;align-items:center;gap:6px;font-size:22px;color:#5f6368;letter-spacing:-.5px;margin-right:8px}
.logo b{font-weight:500}
.logo .gm{color:#ea4335}.logo .gm2{color:#34a853}.logo .gm3{color:#4285f4}
.search{flex:1;max-width:720px;background:#f1f3f4;border-radius:8px;height:48px;display:flex;align-items:center;padding:0 16px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px;color:var(--text);margin-left:10px}
.spacer{flex:1}

/* ShipSync launcher — small, top-right, opens the Dashboard in a NEW tab */
.shipsync-launch{position:relative;display:flex;align-items:center;gap:8px;margin-left:12px}
.ss-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;
  border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;text-decoration:none;color:var(--text);
  transition:box-shadow .15s,border-color .15s}
.ss-btn:hover{border-color:var(--sky);box-shadow:0 1px 6px rgba(56,189,248,.35)}
.ss-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--sky) 52%,var(--indigo));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.ss-label{font-size:13px;font-weight:650;letter-spacing:.2px}
.ss-ext{font-size:11px;color:var(--muted-2)}
/* CSS-only tooltip: no JS listeners, so hovering costs nothing */
.ss-btn .tip{position:absolute;top:calc(100% + 8px);right:0;background:#202124;color:#fff;font-size:12px;
  padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateY(-3px);
  transition:opacity .12s,transform .12s;z-index:40}
.ss-btn:hover .tip,.ss-btn:focus-visible .tip{opacity:1;transform:translateY(0)}
.avatar-me{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4285f4,#1a73e8);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;margin-left:10px}

/* ---------------- layout ---------------- */
.app{display:grid;grid-template-columns:240px minmax(320px,430px) minmax(360px,1fr) 380px;height:calc(100vh - 64px)}
.left{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.compose{margin:12px 8px 14px 12px;border:0;border-radius:16px;background:#c2e7ff;color:#001d35;
  padding:0 24px;height:48px;font-weight:650;font-size:14px;text-align:left;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;align-self:flex-start;box-shadow:0 1px 2px rgba(60,64,67,.3)}
.compose:hover{box-shadow:0 2px 6px rgba(60,64,67,.35)}
.folders{padding:0 8px}
.folder{display:flex;align-items:center;gap:14px;padding:0 0 0 14px;height:32px;border-radius:0 16px 16px 0;
  color:#444746;cursor:pointer;user-select:none}
.folder:hover{background:#f1f3f4}
.folder.active{background:var(--blue-soft);color:#001d35;font-weight:700}
.folder .n{margin-left:auto;padding-right:14px;font-size:12px;font-weight:700}
.sect{padding:16px 22px 6px;font-size:12px;font-weight:650;color:#444746;letter-spacing:.4px}
.lab{display:flex;align-items:center;gap:12px;padding:0 14px;height:30px;border-radius:0 16px 16px 0;color:#444746}
.lab .dot{width:9px;height:9px;border-radius:50%}

/* ---------------- list ---------------- */
.list{background:#fff;border-right:1px solid var(--line);overflow:auto}
.listbar{display:flex;align-items:center;gap:6px;height:48px;padding:0 12px;border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;background:#fff;z-index:2;color:var(--muted)}
.listbar .grow{flex:1}
.row{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;align-items:flex-start}
.row:hover{background:#f8f9fa;box-shadow:inset 1px 0 0 #dadce0}
.row.active{background:var(--blue-hover)}
.row .av{width:20px;height:20px;border-radius:50%;flex:0 0 20px;margin-top:2px;display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff}
.row .mid{flex:1;min-width:0}
.row .r1{display:flex;align-items:center;gap:8px}
.row .who{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .who,.row.unread .subj{font-weight:800}
.row .tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;background:#e8eaed;color:#3c4043}
.row .tag.si{background:#e6f4ea;color:#137333}
.row .tag.bl{background:#e8f0fe;color:#1967d2}
.row .tag.inv{background:#fce8f3;color:#a50e5d}
.row .subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .snip{color:var(--muted-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .tm{font-size:12px;color:var(--muted-2);white-space:nowrap;font-weight:600}
.row .clip{margin-left:6px;color:var(--muted-2);font-size:12px}

/* ---------------- mail ---------------- */
.mail{background:#fff;overflow:auto;display:flex;flex-direction:column}
.mailbar{display:flex;align-items:center;gap:4px;height:52px;padding:0 16px;border-bottom:1px solid var(--line-soft);color:var(--muted)}
.mailbar .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:0;background:none;color:inherit}
.mailbar .ic:hover{background:#f1f3f4}
.mailbar .grow{flex:1}
.wrap{padding:24px 32px 40px}
.subj{font-size:22px;font-weight:400;line-height:1.35;margin-bottom:18px}
.msg{display:flex;gap:14px;align-items:flex-start}
.msg .av{width:40px;height:40px;border-radius:50%;flex:0 0 40px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.msg .who{flex:1;min-width:0}
.msg .who b{font-weight:700}
.msg .who .to{color:var(--muted-2);font-size:12.5px}
.msg .when{color:var(--muted-2);font-size:12px;white-space:nowrap}
.body{margin-top:18px;line-height:1.62;white-space:pre-wrap;color:#222}
.atts{margin-top:26px;border-top:1px solid var(--line-soft);padding-top:16px}
.atts .hd{font-size:13px;color:var(--muted);margin-bottom:10px}
.attrow{display:flex;gap:10px;flex-wrap:wrap}
.att{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fafafa;min-width:210px;cursor:pointer}
.att:hover{border-color:var(--blue);background:#f8fbff}
.att .nm{font-weight:650;font-size:13px;display:flex;align-items:center;gap:7px}
.att .mt{font-size:11.5px;color:var(--muted-2);margin-top:3px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;color:var(--muted);font-size:12px}
.preview{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:#f8f9fa;overflow:hidden}
.preview .ph{padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--muted);background:#fff}
.preview pre{margin:0;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.55;
  max-height:260px;overflow:auto;white-space:pre-wrap}

/* ---------------- side panel ---------------- */
.side{background:linear-gradient(180deg,var(--side),var(--side-2));color:var(--side-text);
  border-left:1px solid #0b1220;overflow:auto;display:flex;flex-direction:column}
.shead{padding:16px 18px;border-bottom:1px solid var(--side-line);display:flex;align-items:center;gap:12px}
.smark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--sky) 52%,var(--indigo));
  display:grid;place-items:center;font-weight:800;color:#06202a}
.shead b{font-size:15px;letter-spacing:.3px}
.shead span{display:block;font-size:11px;color:var(--side-muted);margin-top:2px}
.panel{padding:15px 18px;border-bottom:1px solid var(--side-line)}
.panel h3{margin:0 0 11px;color:var(--side-muted);font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700}
.ship{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ship .id{font-size:19px;font-weight:750;letter-spacing:.5px}
.pill{border-radius:999px;padding:4px 10px;font-weight:700;font-size:11.5px;white-space:nowrap}
.pill.ok{background:rgba(24,128,56,.20);color:#6ee7a8}
.pill.warn{background:rgba(234,134,0,.20);color:#fbbf24}
.pill.bad{background:rgba(217,48,37,.20);color:#fb7185}
.pill.mute{background:rgba(148,163,184,.16);color:#cbd5e1}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:12.5px;margin-top:12px}
.kv span:nth-child(odd){color:var(--side-muted)}
.kv b{font-weight:650;word-break:break-word}
.doc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(148,163,184,.12)}
.doc:last-child{border-bottom:0}
.doc .l b{font-size:13px}
.doc .l small{color:var(--side-muted);font-size:11px;display:block;margin-top:2px;word-break:break-all}
.doc .r{font-size:12px;font-weight:700;white-space:nowrap}
.good{color:#6ee7a8}.bad-tx{color:#fb7185}.miss{color:#fbbf24}.poss{color:#fbbf24;font-weight:600}.dim{color:#94a3b8}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:7px 0;border-bottom:1px solid rgba(148,163,184,.12);vertical-align:top}
td:first-child{color:var(--side-muted);width:46%}
td.val{color:#cbd5e1}
.note{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.28);border-radius:8px;
  padding:10px 12px;font-size:12.5px;color:#fde68a;margin-bottom:10px}
.note.bad{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.3);color:#fda4af}
.btns{display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--side-line);background:#1c2a44;color:var(--side-text);border-radius:8px;
  padding:10px 12px;cursor:pointer;font-weight:650;font-size:13px;width:100%}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--sky));border:0;color:#06202a}
.btn:disabled{opacity:.55;cursor:not-allowed}
.src{font-size:11px;color:var(--side-muted);margin-top:10px;line-height:1.5}
.src b{color:#cbd5e1;font-weight:650}
.empty{padding:26px 18px;color:var(--side-muted);font-size:13px;line-height:1.6}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--sky);border-top-color:transparent;
  display:inline-block;vertical-align:-2px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:1280px){.app{grid-template-columns:200px minmax(280px,360px) 1fr 330px}}
@media(max-width:1020px){.app{grid-template-columns:200px 1fr 330px}.side{position:fixed;right:0;top:64px;bottom:0;box-shadow:-12px 0 30px rgba(0,0,0,.2)}}
@media(max-width:820px){.app{grid-template-columns:1fr}.left,.list,.side{display:none}}
</style>
</head>
<body>

<div class="top">
  <button class="hamburger" aria-label="Main menu"><i></i><i></i><i></i></button>
  <div class="logo"><b class="gm">G</b><b class="gm2">m</b><b class="gm3">a</b><b>il</b></div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="Search mail" aria-label="Search mail">
  </div>
  <div class="spacer"></div>

  <!-- ShipSync logo: ONE click opens the Dashboard in a NEW tab. No hover handlers. -->
  <div class="shipsync-launch">
    <a class="ss-btn" id="ssLaunch" href="/ui/" target="_blank" rel="noopener noreferrer"
       title="Open ShipSync Dashboard" aria-label="Open ShipSync Dashboard">
      <span class="ss-mark">S</span>
      <span class="ss-label">ShipSync</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           style="color:#80868b"><path d="M14 5h5v5M19 5l-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
      <span class="tip">Open ShipSync Dashboard</span>
    </a>
  </div>
  <div class="avatar-me">O</div>
</div>

<div class="app">
  <aside class="left">
    <button class="compose">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#001d35" stroke-width="2">
        <path d="M12 5v14M5 12h14"/></svg>Compose</button>
    <div class="folders">
      <div class="folder active">Inbox <span class="n" id="cInbox">0</span></div>
      <div class="folder">Starred</div>
      <div class="folder">Sent</div>
      <div class="folder">Drafts</div>
      <div class="folder">All Mail</div>
    </div>
    <div class="sect">Labels</div>
    <div class="folders">
      <div class="lab"><span class="dot" style="background:#1a73e8"></span>Shipping</div>
      <div class="lab"><span class="dot" style="background:#188038"></span>Finance</div>
      <div class="lab"><span class="dot" style="background:#ea8600"></span>Needs action</div>
    </div>
  </aside>

  <section class="list" id="list">
    <div class="listbar">
      <span>Inbox</span><span class="grow"></span><span id="listMeta"></span>
    </div>
    <div id="rows"></div>
  </section>

  <main class="mail" id="mail"></main>

  <aside class="side" id="side"></aside>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Simulated Gmail — static demo inbox.

   Traffic rules this file deliberately follows:
     * Opening the inbox reads LOCAL static JSON only. Zero backend calls.
     * Selecting an email renders from memory, or reads a STORED result
       (GET /api/results/{id}). Reading never triggers processing.
     * Processing happens ONLY when the user presses "Run ShipSync" or
       "Re-process" (POST /api/process).
     * No setInterval, no polling, no background refresh anywhere.
   ========================================================================= */
const API = "";                       // same origin as the ShipSync backend
const DATA = "data/";                 // static demo data, served as files
let EMAILS = [], SHIPMENTS = {}, active = 0;
const results = Object.create(null);  // in-memory mirror of stored results
const attText = Object.create(null);  // static attachment text cache

const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color = s => { let h = 0; for (const ch of (s||"")) h = (h*31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 62% 45%)`; };
const initials = n => (n||"?").split(/[\s.@]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const FIELD_LABELS = {
  port_of_loading:"Port of Loading", port_of_discharge:"Port of Discharge",
  container_count:"Container Count", gross_weight_kg:"Gross Weight",
  shipper:"Shipper", consignee:"Consignee", notify_party:"Notify Party",
  etd:"ETD (Departure)", eta:"ETA (Arrival)",
};
const label = k => FIELD_LABELS[k] || k.replace(/_kg/,"").replace(/_/g," ").replace(/\b\w/g, c => c.toUpperCase());

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 2400);
}

/* ------------------------------------------------------------------ boot */
async function boot(){
  // Both are static files next to this page — no ShipSync API involvement.
  const [emails, ships] = await Promise.all([
    fetch(DATA + "emails.json").then(r => r.json()).catch(() => ({emails: []})),
    fetch(DATA + "shipments.json").then(r => r.json()).catch(() => ({shipments: []})),
  ]);
  EMAILS = emails.emails || [];
  SHIPMENTS = Object.fromEntries((ships.shipments || []).map(s => [s.shipment_id, s]));
  $("cInbox").textContent = EMAILS.length;
  $("listMeta").textContent = EMAILS.length + " conversations";
  renderList();
  if (EMAILS.length) openMail(0);
}

/* ----------------------------------------------------------------- list */
function renderList(){
  const q = ($("q").value || "").toLowerCase();
  const shown = EMAILS.filter(e =>
    !q || (e.subject + " " + e.from_name + " " + e.snippet + " " + e.shipment_id).toLowerCase().includes(q));
  $("rows").innerHTML = shown.map(e => {
    const i = EMAILS.indexOf(e);
    const kinds = [...new Set(e.attachments.map(a => a.kind))];
    return `<div class="row ${i===active?"active":""} ${e.unread?"unread":""}" onclick="openMail(${i})">
      <div class="av" style="background:${color(e.from_name)}">${esc(initials(e.from_name))}</div>
      <div class="mid">
        <div class="r1"><span class="who">${esc(e.from_name)}</span>
          ${kinds.map(k=>`<span class="tag ${k.toLowerCase()}">${esc(k)}</span>`).join("")}</div>
        <div class="subj">${esc(e.subject)}</div>
        <div class="snip">${esc(e.snippet)}</div>
      </div>
      <div><div class="tm">${esc(e.received)}</div>
        ${e.attachments.length?`<div class="clip" title="${e.attachments.length} attachment(s)">&#128206; ${e.attachments.length}</div>`:""}
      </div></div>`;
  }).join("") || `<div class="empty">No conversations match.</div>`;
}

/* ----------------------------------------------------------------- mail */
function renderMail(){
  const e = EMAILS[active];
  const ship = SHIPMENTS[e.shipment_id] || {};
  $("mail").innerHTML = `
    <div class="mailbar">
      <button class="ic" title="Archive">&#8592;</button>
      <button class="ic" title="Report spam">&#9873;</button>
      <button class="ic" title="Delete">&#128465;</button>
      <span class="grow"></span>
      <span class="chip">${esc(e.shipment_id)}</span>
      <span class="chip">${esc(ship.status || "INBOX")}</span>
    </div>
    <div class="wrap">
      <div class="subj">${esc(e.subject)}</div>
      <div class="msg">
        <div class="av" style="background:${color(e.from_name)}">${esc(initials(e.from_name))}</div>
        <div class="who"><b>${esc(e.from_name)}</b> <span style="color:var(--muted-2)">&lt;${esc(e.from)}&gt;</span>
          <div class="to">to ${esc(e.to)}</div></div>
        <div class="when">${esc(e.received)}</div>
      </div>
      <div class="body">${esc(e.body)}</div>
      <div class="atts">
        <div class="hd">${e.attachments.length} attachment(s)</div>
        <div class="attrow">
          ${e.attachments.map((a,i)=>`<div class="att" onclick="previewAtt(${i})">
            <div class="nm">&#128196; ${esc(a.filename)}</div>
            <div class="mt">${esc(a.kind)} · ${a.size_kb} KB</div></div>`).join("")
            || `<span style="color:var(--muted-2);font-size:13px">No attachments</span>`}
        </div>
        <div id="preview"></div>
      </div>
    </div>`;
}

async function previewAtt(i){
  const a = EMAILS[active].attachments[i];
  const key = a.path || a.filename;   // Static file, same origin. Not a backend call.
  if (attText[key] === undefined){
    attText[key] = await fetch(key).then(r => r.ok ? r.text() : "(could not read file)")
                                         .catch(() => "(could not read file)");
  }
  $("preview").innerHTML = `<div class="preview"><div class="ph">${esc(a.filename)}</div>
    <pre>${esc(attText[key])}</pre></div>`;
}

/* ------------------------------------------------------- open email flow */
async function openMail(i){
  active = i;
  const e = EMAILS[i];
  if (e.unread){ e.unread = false; }   // local demo state only
  renderList(); renderMail();

  // 1) Already known → render instantly, zero network.
  if (results[e.id]){ renderSide(results[e.id]); return; }
  // 2) Otherwise READ the stored result. This never processes anything.
  showLoading("Reading stored ShipSync result…");
  try{
    const r = await fetch(`${API}/api/results/${encodeURIComponent(e.id)}`);
    if (r.ok){
      results[e.id] = await r.json();
      renderSide(results[e.id]);
      return;
    }
    if (r.status !== 404) throw new Error("HTTP " + r.status);
  }catch(err){ /* fall through to the not-processed state */ }
  renderIdle();
}

async function attachmentsFor(e){
  const out = [];
  for (const a of e.attachments){
    // Static files are fetched by path; documents delivered by the
    // Request-BL action (path === null) already live in the cache under
    // their filename.
    const key = a.path || a.filename;
    if (attText[key] === undefined){
      attText[key] = await fetch(key).then(r => r.ok ? r.text() : "").catch(() => "");
    }
    out.push({filename: a.filename, content_text: attText[key]});
  }
  return out;
}

/* POST /api/process — the ONLY place processing is requested. */
async function runShipSync(force){
  const e = EMAILS[active];
  showLoading(force ? "Re-processing with ShipSync…" : "ShipSync is processing this email…");
  try{
    const res = await fetch(API + "/api/process", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        email_id: e.id, message_id: e.message_id, thread_id: e.thread_id,
        shipment_id: e.shipment_id, from: e.from, subject: e.subject,
        body: e.body, attachments: await attachmentsFor(e),
        source: "simulated-gmail", force: !!force,
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    results[e.id] = data;
    renderSide(data);
    toast(data.cached ? "Reused stored result — nothing re-processed." : "ShipSync processed this email.");
  }catch(err){
    $("side").innerHTML = sideHead() +
      `<div class="empty">Could not reach the ShipSync API (${esc(err.message)}).<br><br>
       <button class="btn" onclick="runShipSync(false)">Try again</button></div>`;
  }
}

async function requestDoc(doc){
  const e = EMAILS[active];
  showLoading(`Requesting ${doc} from the customer…`);
  try{
    const res = await fetch(API + "/api/mock-customer-db/request-document", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({shipment_id: e.shipment_id, document_type: doc}),
    });
    const data = await res.json();
    if (!data.found){
      $("side").innerHTML = sideHead() + `<div class="empty">${esc(data.message)}</div>`;
      return;
    }
    // The document arrived: attach it, then explicitly process again.
    e.attachments.push({filename: data.attachment.filename, path: null,
                        size_kb: 2, kind: doc});
    attText[data.attachment.filename] = data.attachment.content_text;
    renderMail();
    toast(`${doc} received — re-processing.`);
    await runShipSync(true);
  }catch(err){
    $("side").innerHTML = sideHead() + `<div class="empty">Request failed: ${esc(err.message)}</div>`;
  }
}

/* ---------------------------------------------------------- side panel */
function sideHead(){
  return `<div class="shead"><div class="smark">S</div>
    <div><b>ShipSync</b><span>Side panel · live from the API</span></div></div>`;
}
function showLoading(msg){
  $("side").innerHTML = sideHead() +
    `<div class="empty"><span class="spin"></span> ${esc(msg)}</div>`;
}
function renderIdle(){
  const e = EMAILS[active];
  $("side").innerHTML = sideHead() + `
    <div class="panel"><h3>Shipment</h3>
      <div class="ship"><span class="id">${esc(e.shipment_id)}</span>
        <span class="pill mute">NOT PROCESSED</span></div>
      <div class="kv"><span>From</span><b>${esc(e.from_name)}</b>
        <span>Attachments</span><b>${e.attachments.length || "none"}</b></div></div>
    <div class="panel"><h3>Action</h3>
      <p style="margin:0 0 12px;color:var(--side-muted);font-size:12.5px;line-height:1.55">
        This email has not been sent through ShipSync yet. Processing runs once and
        the result is stored for the Dashboard.</p>
      <div class="btns"><button class="btn primary" onclick="runShipSync(false)">Run ShipSync</button></div></div>`;
}

function renderSide(r){
  const e = EMAILS[active];
  const st = r.status;
  const cls = st === "OK" ? "ok" : st === "MISMATCH" ? "bad" : st === "NEEDS_REVIEW" ? "warn" : "mute";
  const v = r.verification || {};
  const missing = r.missing_documents || [];

  $("side").innerHTML = sideHead() + `
    <div class="panel">
      <h3>Shipment</h3>
      <div class="ship"><span class="id">${esc(r.shipment_id || e.shipment_id)}</span>
        <span class="pill ${cls}">${esc(st)}</span></div>
      <div class="kv">
        <span>Doc type</span><b>${esc(docTypes(r))}</b>
        <span>Category</span><b>${esc(r.category)}</b>
        <span>Action</span><b>${esc(r.suggested_action || "—")}</b>
      </div>
    </div>

    <div class="panel"><h3>Documents</h3>${docs(r, missing)}</div>
    <div class="panel"><h3>Extracted fields</h3>${fields(r)}</div>
    <div class="panel"><h3>Verification</h3>${verify(r, v, missing)}</div>
    <div class="panel"><h3>Required actions</h3>${actions(r, missing)}</div>
    <div class="panel" style="border-bottom:0">
      <div class="src">${esc(r.cached
        ? "Stored result — reused, pipeline NOT re-run."
        : "Freshly processed by the ShipSync core.")}
        <br>Processing time <b>${esc(r.cached ? "0 ms (cached)" : Math.round(r.processing_ms||0) + " ms")}</b>
        · run <b>#${esc(r.attempts || 1)}</b>
        ${r.processed_at ? `<br>Stored at <b>${esc(String(r.processed_at).replace("T"," ").slice(0,19))}</b>` : ""}
      </div>
    </div>`;
}

function docTypes(r){
  const t = [...new Set((r.documents||[]).map(d => d.type))];
  return t.length ? t.join(" + ") : "none";
}

function docs(r, missing){
  const rows = (r.documents || []).map(d => {
    const miss = d.status === "missing";
    const ok = !miss && d.type !== "UNKNOWN";
    return `<div class="doc">
      <div class="l"><b>${miss ? "✗" : ok ? "✓" : "•"} ${esc(d.type)}</b>
        <small>${esc(d.filename || "not received")}${d.version ? " · " + esc(d.version) : ""}</small></div>
      <div class="r ${miss ? "miss" : ok ? "good" : "dim"}">${miss ? "MISSING" : esc(d.status)}</div>
    </div>`;
  }).join("");
  return rows || `<div class="dim" style="font-size:12.5px">No shipping documents detected.</div>`;
}

function fields(r){
  const entries = Object.entries(r.extracted_fields || {});
  if (!entries.length) return `<div class="dim" style="font-size:12.5px">No comparable fields yet.</div>`;
  return `<table>${entries.map(([k, v]) => `
    <tr><td>${esc(label(k))}</td><td class="val">SI: ${esc(v.si ?? "—")}<br>BL: ${esc(v.bl ?? "—")}</td></tr>`).join("")}</table>`;
}

function verify(r, v, missing){
  const rows = v.field_results || [];
  if (!rows.length){
    if (missing.length) return `<div class="note">Missing document(s): ${esc(missing.join(", "))}.
      Cross-document verification starts once both sides exist.</div>`;
    return `<div class="dim" style="font-size:12.5px">No SI/BL pair to verify.</div>`;
  }
  const bad = (r.defect_fields || []).length;
  const poss = (r.possible_fields || []).length;
  const head = bad ? `<div class="note bad">${bad} field(s) mismatch — do not release the BL.</div>`
    : poss ? `<div class="note warn">⚠ ${poss} field(s) possible match (OCR noise) — review required.</div>`
    : (r.status === "OK" ? `<div class="note">All scored fields match.</div>` : "");
  return head + `<table>${rows.map(fr => `
    <tr><td>${esc(label(fr.field))}</td>
      <td class="${fr.match === true ? "good" : fr.match === "POSSIBLE" ? "poss" : fr.match === false ? "bad-tx" : "miss"}">
        ${fr.match === true ? "✓ Match" : fr.match === "POSSIBLE" ? "⚠ Possible (review)" : fr.match === false ? "⚠ Mismatch" : "? Undecidable"}
      </td></tr>`).join("")}</table>`;
}

function actions(r, missing){
  const out = [];
  if (missing.length){
    const doc = missing[0];
    out.push(`<div class="note">⚠ ${esc(doc)} is missing.</div>`);
    out.push(`<button class="btn primary" onclick="requestDoc('${esc(doc)}')">Request ${esc(doc)}</button>`);
  }
  if (r.status === "MISMATCH"){
    out.push(`<button class="btn" onclick="openDashboard()">Open mismatch in Dashboard</button>`);
  }
  if (r.status === "NEEDS_REVIEW"){
    out.push(`<button class="btn" onclick="openDashboard()">Open review in Dashboard</button>`);
  }
  out.push(`<button class="btn" onclick="runShipSync(true)">Re-process (explicit)</button>`);
  return `<div class="btns">${out.join("")}</div>`;
}

/* The logo opens the Dashboard in a new tab; this helper is the in-panel
   equivalent. Both use target=_blank so the inbox is never navigated away. */
function openDashboard(){
  window.open("/ui/", "_blank", "noopener");
}

/* ----------------------------------------------------------------- init */
$("q").addEventListener("input", renderList);
window.runShipSync = runShipSync;
window.requestDoc = requestDoc;
window.previewAtt = previewAtt;
window.openDashboard = openDashboard;
boot();
</script>
