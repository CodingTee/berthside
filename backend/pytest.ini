[pytest]
# Pin collection to tests/. `scripts/smoke_test.py` matches pytest's default
# `*_test.py` pattern, so a bare `pytest` run from backend/ would import it; it
# talks to a live server over HTTP and must never be collected as a unit test.
# tests/ is also the only directory covered by conftest.py isolation, so this
# keeps every collected test off the real sdoc.db and data/ingested/.
testpaths = tests
