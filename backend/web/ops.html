<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDOC · Review Queue (Grouped)</title>
<style>
:root{
  --bg:#070b14; --bg-2:#0a1120; --surface:rgba(255,255,255,.025); --surface-2:#0d1526;
  --surface-3:#121d33; --surface-hover:rgba(45,212,191,.06); --border:rgba(148,163,184,.12);
  --border-strong:rgba(148,163,184,.22); --text:#e9eef7; --muted:#8b9bb4; --muted-2:#5d6b83;
  --accent:#2dd4bf; --accent-2:#38bdf8; --grad:linear-gradient(135deg,#2dd4bf 0%,#38bdf8 52%,#6366f1 100%);
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 600px at 12% -5%,rgba(45,212,191,.10),transparent 60%),
  radial-gradient(1000px 700px at 100% 0%,rgba(99,102,241,.10),transparent 55%);}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:26px 22px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
header .mark{width:42px;height:42px;border-radius:12px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 8px 22px -8px rgba(45,212,191,.6)}
header h1{font-size:19px;font-weight:750;letter-spacing:.3px}
header .tag{font-size:11px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.head-row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px}
a.back{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--border);
  padding:7px 13px;border-radius:9px;transition:.16s}
a.back:hover{border-color:var(--accent)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:linear-gradient(160deg,var(--surface-2),var(--bg-2));border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;box-shadow:0 18px 50px -20px rgba(0,0,0,.65)}
.kpi .lab{font-size:11px;color:var(--muted);letter-spacing:.4px}
.kpi .num{font-size:28px;font-weight:780;margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:var(--muted-2);margin-top:5px}
.kpi.accent .num{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* groups */
.group{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;
  overflow:hidden;box-shadow:0 18px 45px -22px rgba(0,0,0,.5)}
.ghead{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.ghead:hover{background:var(--surface-hover)}
.ghead .gt{font-size:14.5px;font-weight:650}
.ghead .gc{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface-3);
  padding:3px 11px;border-radius:20px;border:1px solid var(--border)}
.ghead .chev{transition:.2s;color:var(--muted-2)}
.group.collapsed .ghead{border-bottom:none}
.group.collapsed .gbody{display:none}
.gbody{padding:6px 10px 12px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;
  transition:background .15s;border:1px solid transparent}
.item:hover{background:var(--surface-hover);border-color:var(--border)}
.item .sbj{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.item .from{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:220px}
.item .id{font-family:var(--mono);font-size:10.5px;color:var(--muted-2)}
.item .ev{font-size:11px;color:var(--warn);font-family:var(--mono);margin-left:auto;text-align:right;max-width:230px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* detail */
.detail{margin-top:8px}
.detail .dhead{padding:18px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface-3),transparent)}
.detail h2{font-size:16px;margin:8px 0 8px;line-height:1.4}
.kv{font-size:12.5px;color:var(--muted);margin:3px 0}
.kv b{color:var(--text);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:20px;font-size:10.5px;font-weight:650}
.badge.st{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 36%,transparent)}
.badge.st.NEEDS_REVIEW{--c:var(--warn)} .badge.st.MISMATCH{--c:var(--bad)} .badge.st.OK{--c:var(--ok)}
.reason-box{border:1px solid var(--warn-bd,#fbbf2466);background:rgba(251,191,36,.10);border-radius:11px;
  padding:13px 15px;margin:14px 20px;font-size:12.8px;line-height:1.55}
.reason-box b{color:var(--warn)}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px;border:1px solid var(--border);
  border-radius:10px;overflow:hidden;margin:0 20px 18px}
table.cmp th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted-2);
  padding:9px 12px;background:var(--surface-3);border-bottom:1px solid var(--border);font-weight:600}
table.cmp td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.cmp tr:last-child td{border-bottom:none}
tr.cmp-row.match td{background:rgba(52,211,153,.10)}
tr.cmp-row.diff td{background:rgba(251,113,133,.10)}
tr.cmp-row.miss td{background:rgba(251,191,36,.10)}
td.f{font-weight:600;white-space:nowrap}
.val{font-family:var(--mono);font-size:12px;word-break:break-word}
.vpill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:650}
.vpill.ok{color:var(--ok);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.38)}
.vpill.bad{color:var(--bad);background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.40)}
.vpill.miss{color:var(--warn);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.40)}
section h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted-2);margin:16px 20px 10px}
.empty{padding:50px 24px;text-align:center;color:var(--muted-2)}
.spin{width:15px;height:15px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;
  animation:s .7s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.item .from{display:none}.item .ev{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
    </div>
    <div><div class="tag">Triage Board</div><h1>Review Queue · grouped by reason</h1></div>
  </header>
  <div class="head-row">
    <div style="color:var(--muted);font-size:12.5px">Every email the engine escalated, bucketed so a human clears one pile at a time.</div>
    <a class="back" href="/ui/">← Back to Review Console</a>
  </div>
  <div class="kpis" id="kpis"></div>
  <div id="queue"><div class="empty"><span class="spin"></span> &nbsp;Loading review queue…</div></div>
  <div id="detailHost"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const API = "";
const FIELDS_LABEL = {shipper:"Shipper",consignee:"Consignee",notify_party:"Notify party",
  port_of_loading:"Port of loading",port_of_discharge:"Port of discharge",
  container_count:"Container count",gross_weight_kg:"Gross weight (kg)"};
const esc = s => (s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

async function loadSummary(){
  const s = await (await fetch(API+"/api/summary")).json();
  const bs=s.by_status||{}, tot=s.total||0;
  const ok=bs.OK||0, mm=bs.MISMATCH||0, nr=bs.NEEDS_REVIEW||0;
  $("#kpis").innerHTML = `
    <div class="kpi accent"><div class="lab">Emails processed</div><div class="num">${tot}</div><div class="sub">operations inbox</div></div>
    <div class="kpi"><div class="lab">Cleared · OK</div><div class="num" style="color:var(--ok)">${ok}</div><div class="sub">no mismatch</div></div>
    <div class="kpi"><div class="lab">Mismatches</div><div class="num" style="color:var(--bad)">${mm}</div><div class="sub">SI ↔ BL differ</div></div>
    <div class="kpi"><div class="lab">Escalated</div><div class="num" style="color:var(--warn)">${nr}</div><div class="sub">${s.reviewed||0} human reviews</div></div>`;
}

async function loadQueue(){
  const q = await (await fetch(API+"/api/review-queue")).json();
  const host = $("#queue");
  if(!q.groups.length){host.innerHTML='<div class="empty">No escalations — the queue is clear. 🎉</div>';return;}
  host.innerHTML = q.groups.map((g,i)=>`
    <div class="group" data-i="${i}">
      <div class="ghead" onclick="toggleGroup(${i})">
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        <div class="gt">${esc(g.label)}</div>
        <div class="gc">${g.count}</div>
      </div>
      <div class="gbody">
        ${g.items.map(it=>`
          <div class="item" onclick="openDetail('${esc(it.email_id)}')">
            <div style="flex:1;min-width:0">
              <div class="sbj">${esc(it.subject||"(no subject)")}</div>
              <div class="from">${esc(it.from||"unknown")} · <span class="id">${esc(it.email_id)}</span></div>
            </div>
            <div class="ev">${esc(it.evidence||"")}</div>
          </div>`).join("")}
      </div>
    </div>`).join("");
}
function toggleGroup(i){
  const el=document.querySelector(`.group[data-i="${i}"]`);
  el.classList.toggle("collapsed");
  const chev=el.querySelector(".chev");
  chev.style.transform = el.classList.contains("collapsed") ? "rotate(-90deg)" : "";
}

async function openDetail(id){
  const d = await (await fetch(API+"/api/emails/"+id)).json();
  const r=d.result, e=d.email;
  let cmp="";
  if(d.comparisons&&d.comparisons.length){
    const rows=d.comparisons.map(c=>{
      const cls=c.missing?"miss":(c.match?"match":"diff");
      const mark=c.missing?`<span class="vpill miss">missing</span>`:c.match?`<span class="vpill ok">match</span>`:`<span class="vpill bad">differs</span>`;
      const fld=FIELDS_LABEL[c.field]||c.field;
      return `<tr class="cmp-row ${cls}"><td class="f">${fld}</td><td class="val">${esc(c.si_value??"—")}</td><td class="val">${esc(c.bl_value??"—")}</td><td>${mark}</td></tr>`;
    }).join("");
    cmp=`<section><h3>SI → draft BL · field comparison</h3>
      <table class="cmp"><thead><tr><th>Field</th><th>Shipping Instruction</th><th>Draft Bill of Lading</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></section>`;
  }
  const reason = r.status==="NEEDS_REVIEW"
    ? `<div class="reason-box"><b>Escalation reason:</b> ${esc(r.review_reason||"—")}. The engine could not decide automatically — review and confirm or override in the <a href="/ui/#${esc(id)}" style="color:var(--accent)">Review Console</a>.</div>`
    : "";
  $("#detailHost").innerHTML = `
    <div class="detail" style="background:var(--surface-2);border:1px solid var(--border);border-radius:14px;margin-top:8px;overflow:hidden">
      <div class="dhead">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="badge st ${r.status}">${r.status}</span>
          <span style="color:var(--muted);font-size:12px">${esc(r.category)}</span>
        </div>
        <h2>${esc(e.subject||"(no subject)")}</h2>
        <div class="kv"><b>From:</b> ${esc(e.from||"unknown")} &nbsp;·&nbsp; <b>ID:</b> <span style="font-family:var(--mono)">${esc(e.email_id)}</span></div>
        ${reason}
      </div>
      ${cmp}
    </div>`;
  $("#detailHost").scrollIntoView({behavior:"smooth",block:"start"});
}

loadSummary().then(loadQueue);
</script>
</body>
</html>
