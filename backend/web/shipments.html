/* ---------- contextual tooltips ---------- */
/* Elements opt in with data-tip / data-tip-desc / data-tip-kbd / data-tip-pos.
   This replaces the slow native `title` bubble so the icon rail is readable
   even when the sidebar is collapsed to icons. */
(function(){
  const tip=document.getElementById("tip");
  let cur=null;
  function place(el){
    const r=el.getBoundingClientRect(), pos=el.dataset.tipPos||"bottom";
    tip.style.left="-9999px"; tip.style.top="0px";
    const tw=tip.offsetWidth||220, th=tip.offsetHeight||40;
    let x, y;
    if(pos==="right"){
      x=r.right+16; y=r.top+(r.height-th)/2;
      if(x+tw>innerWidth-8) x=Math.max(8, r.left-tw-16);
    }else{
      x=r.left; y=r.bottom+9;
      if(x+tw>innerWidth-8) x=innerWidth-8-tw;
      if(y+th>innerHeight-8) y=r.top-th-9;
    }
    tip.style.left=Math.round(Math.max(8,x))+"px";
    tip.style.top=Math.round(Math.max(8, Math.min(y, innerHeight-8-th)))+"px";
  }
  function open(el){
    if(cur===el) return;
    if(!palEl.hidden || !helpEl.hidden) return;
    /* A screen reader never sees the hover card, so tie the element to the live
       tooltip via aria-describedby (it fires on focusin too). */
    if(cur) cur.removeAttribute("aria-describedby");
    cur=el;
    el.setAttribute("aria-describedby","tip");
    const keys=(el.dataset.tipKbd||"").split("|").filter(Boolean);
    tip.innerHTML='<div class="tip-t">'+esc(el.dataset.tip)+'</div>'+
      (el.dataset.tipDesc?'<div class="tip-d">'+esc(el.dataset.tipDesc)+'</div>':'')+
      (keys.length?'<div class="tip-k">'+keys.map(function(k){ return '<b>'+esc(k)+'</b>'; }).join("")+'</div>':'');
    tip.classList.add("show");
    place(el);
  }
  function close(){ if(cur) cur.removeAttribute("aria-describedby"); cur=null; tip.classList.remove("show"); }
  document.addEventListener("mouseover", function(e){
    const el=e.target.closest && e.target.closest("[data-tip]");
    if(el) open(el);
    else if(cur && !cur.contains(e.target)) close();
  });
  document.addEventListener("mouseout", function(e){
    if(cur && !cur.contains(e.relatedTarget)) close();
  });
  document.addEventListener("focusin", function(e){
    const el=e.target.closest && e.target.closest("[data-tip]");
    if(el) open(el); else close();
  });
  document.addEventListener("focusout", close);
  document.addEventListener("click", close);
  window.addEventListener("scroll", close, true);
  window.addEventListener("blur", close);
  window.addEventListener("resize", close);
})();
/* platform-aware modifier chip + tooltip key on the search button */
(function(){
  const el=document.getElementById("searchBtn");
  if(!el) return;
  el.dataset.tipKbd=MODK+"|K";
  const chip=el.querySelector(".hk");
  if(chip) chip.textContent=IS_MAC?"\u2318K":"Ctrl K";
})();

/* ---------- global shortcuts ---------- */
document.addEventListener("keydown",e=>{
  /* Ctrl/⌘+K toggles search from anywhere, even while typing */
  if((e.key==="k"||e.key==="K")&&(e.metaKey||e.ctrlKey)){
    e.preventDefault();
    if(palEl.hidden) palOpen(); else palClose();
    return;
  }
  if(!palEl.hidden){
    if(e.key==="Escape"){ e.preventDefault(); palClose(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); palMove(1); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); palMove(-1); return; }
    if(e.key==="Enter"){ e.preventDefault(); palRun(); return; }
    return;
  }
  if(!helpEl.hidden){
    if(e.key==="Escape"||e.key==="?"){ e.preventDefault(); closeHelp(); }
    return;
  }
  if(isTyping(e.target)) return;
  const k=e.key;

  /* ---- Global shortcuts -------------------------------------------------
     These MUST sit above the view-specific blocks. The dashboard block below
     has no catch-all, so a key it does not consume falls through to here; but
     anything placed after it would be unreachable anyway. Keeping the globals
     first is what makes `[`, `T`, `?` and `Esc` work on the dashboard too.
     `]` and the full-width brackets are accepted as aliases so the rail still
     toggles when a CJK input mode rewrites the key. */
  if(k==="t"||k==="T"){ e.preventDefault(); toggleTheme(); return; }
  if(k==="["||k==="]"||k==="\u3010"||k==="\u3011"||k==="\uff3b"||k==="\uff3d"){
    e.preventDefault(); toggleRail(); return;
  }
  if(k==="?"){ e.preventDefault(); openHelp(); return; }
  if(k==="Escape"){ if(state.current){ e.preventDefault(); goDashboard(); } return; }

  if(k==="1"){ e.preventDefault(); navTo(NAV.console.href); return; }
  if(k==="2"){ e.preventDefault(); goShipments(); return; }
  if(k==="b"||k==="B"){ e.preventDefault(); navTo(NAV.back.href); return; }
  if(k==="g"||k==="G"){ e.preventDefault(); goDashboard(); return; }

  /* ---- Detail view: resolution actions + compare / swap ---- */
  if(state.current){
    /* Shift combos first. Shift+S reports e.key==="S", so the plain "S = swap"
       check must exclude shift or it would shadow "Shift+S = suggest". */
    if(e.shiftKey && (k==="s"||k==="S")){ e.preventDefault(); pressAct("suggest"); return; }
    if(!e.shiftKey && (k==="c"||k==="C") && document.getElementById("fromSel")){ e.preventDefault(); pressAct("compare"); return; }
    if(!e.shiftKey && (k==="s"||k==="S") && document.getElementById("fromSel")){ e.preventDefault(); swapCompare(); return; }
    if(k==="a"||k==="A"){ e.preventDefault(); pressAct("approve"); return; }
    if(k==="x"||k==="X"){ e.preventDefault(); pressAct("reject"); return; }
    if(k==="d"||k==="D"){ e.preventDefault(); pressAct("draft"); return; }
    return;
  }

  /* ---- Dashboard view: row navigation, filter chips + refresh ---- */
  {
    /* ↑/↓ walk the row highlight and keep it in view; Enter opens it. This is the
       list counterpart of the inbox arrows, so both consoles behave the same way. */
    if(k==="ArrowDown"||k==="ArrowUp"){
      const rows=[...view.querySelectorAll("table.list tbody tr")];
      if(rows.length){
        e.preventDefault();
        let i=rows.findIndex(r=>r.classList.contains("sel"));
        if(i<0) i = k==="ArrowDown" ? -1 : 0;
        i = k==="ArrowDown" ? (i+1)%rows.length : (i-1+rows.length)%rows.length;
        state.dashSel=i;
        rows.forEach((r,n)=>r.classList.toggle("sel",n===i));
        keepRowVisible(rows[i]);
      }
      return;
    }
    if(k==="Enter"){
      const row=view.querySelector("table.list tbody tr.sel");
      if(row){ e.preventDefault(); state.dashSel=[...view.querySelectorAll("table.list tbody tr")].indexOf(row); location.hash="#/s/"+row.dataset.id; return; }
    }
    const fv={a:"all",v:"ok",n:"review"}, fr={c:"clear",u:"unresolved",p:"pending"};
    const lk=(k||"").toLowerCase();
    if(e.shiftKey){
      if(lk==="a"){ e.preventDefault(); setDashFilter("res","all"); return; }
      if(lk==="r"){ e.preventDefault(); setDashFilter("res","resolved"); return; }
      if(fr[lk]){ e.preventDefault(); setDashFilter("res",fr[lk]); return; }
      return;
    }
    if(fv[lk]){ e.preventDefault(); setDashFilter("ver",fv[lk]); return; }
    if(k==="r"||k==="R"){ e.preventDefault(); pressAct("refresh-dash"); return; }
  }
});

/* theme toggle is a div — make it behave like a button when focused */
document.getElementById("themeBtn").addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleTheme(); }
});

/* ---------- go ---------- */
route();
