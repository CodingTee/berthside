<title>ShipSync · Advanced Shipment Workflow</title>
<script>
/* Apply the saved theme before first paint so the page never flashes the wrong mode.
   Shared key `sdoc-theme` is the same one the Review Console (/ui/) uses. */
(function(){try{
  var t=localStorage.getItem("sdoc-theme")||localStorage.getItem("shipsync-theme");
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
}catch(_){}})();
</script>
<style>
:root{
  --bg:#080d18; --bg-2:#0b1222;
  --surface:rgba(255,255,255,.036);
  --surface-2:#0f1829; --surface-3:#152036; --surface-hover:rgba(45,212,191,.07);
  --border:rgba(148,163,184,.17); --border-strong:rgba(148,163,184,.30);
  /* Dark mode is deliberately lifted: near-white body text, brighter secondary /
     tertiary steps and more visible hairlines, so small mono values stay legible. */
  --text:#f2f6ff; --muted:#a3b2c9; --muted-2:#7f8ea8;
  --accent:#2dd4bf; --accent-2:#38bdf8; --accent-3:#6366f1;
  --grad:linear-gradient(135deg,#2dd4bf 0%,#38bdf8 52%,#6366f1 100%);
  --grad-btn:linear-gradient(135deg,#0f766e 0%,#0e7490 50%,#4338ca 100%);
  --ok:#34d399; --ok-bg:rgba(52,211,153,.12); --ok-bd:rgba(52,211,153,.38);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12); --warn-bd:rgba(251,191,36,.40);
  --bad:#fb7185; --bad-bg:rgba(251,113,133,.12); --bad-bd:rgba(251,113,133,.40);
  --shadow:0 18px 50px -20px rgba(0,0,0,.65);
  --focus-ring:rgba(45,212,191,.18);
  --radius:14px; --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
[data-theme="light"]{
  --bg:#eef2f8; --bg-2:#e6ecf5;
  --surface:rgba(255,255,255,.65); --surface-2:#ffffff; --surface-3:#f5f8fc; --surface-hover:rgba(13,148,136,.07);
  --border:rgba(15,23,42,.10); --border-strong:rgba(15,23,42,.18);
  --text:#0f1b2d; --muted:#54657f; --muted-2:#5e6d82;
  --accent:#0d9488; --accent-2:#0284c7; --accent-3:#4f46e5;
  --grad:linear-gradient(135deg,#0d9488 0%,#0284c7 52%,#4f46e5 100%);
  --grad-btn:linear-gradient(135deg,#0f766e 0%,#0e7490 50%,#4338ca 100%);
  --ok:#059669; --ok-bg:rgba(5,150,105,.10); --ok-bd:rgba(5,150,105,.34);
  --warn:#d97706; --warn-bg:rgba(217,119,6,.10); --warn-bd:rgba(217,119,6,.36);
  --bad:#e11d48; --bad-bg:rgba(225,29,72,.09); --bad-bd:rgba(225,29,72,.34);
  --shadow:0 18px 45px -22px rgba(15,23,42,.30);
  --focus-ring:rgba(13,148,136,.20);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;
  -webkit-font-smoothing:antialiased;letter-spacing:.1px;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 600px at 12% -5%,rgba(45,212,191,.10),transparent 60%),
    radial-gradient(1000px 700px at 100% 0%,rgba(99,102,241,.10),transparent 55%),
    radial-gradient(800px 600px at 80% 110%,rgba(56,189,248,.07),transparent 60%)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}
::-webkit-scrollbar-track{background:transparent}

.app{position:relative;z-index:1;display:flex;height:100vh}
/* ---------- sidebar ---------- */
.sidebar{width:268px;flex:0 0 268px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--surface-2),var(--bg-2));
  border-right:1px solid var(--border);padding:18px 16px;gap:13px;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
  transition:width .3s cubic-bezier(.4,0,.2,1),flex-basis .3s cubic-bezier(.4,0,.2,1),
    padding .3s cubic-bezier(.4,0,.2,1),gap .3s cubic-bezier(.4,0,.2,1)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--grad);
  display:grid;place-items:center;box-shadow:0 8px 22px -8px rgba(45,212,191,.6);flex:0 0 auto}
.brand .mark svg{width:22px;height:22px}
.brand-txt{min-width:0;overflow:hidden}
.brand .name{font-weight:750;font-size:16px;letter-spacing:.4px;line-height:1.15;white-space:nowrap}
.brand .tag{font-size:9.8px;color:var(--muted);letter-spacing:.9px;text-transform:uppercase;white-space:nowrap}
.nav-sec{display:flex;flex-direction:column;gap:8px}
.wf-title{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted-2);margin-bottom:2px}
.navlink{position:relative;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);text-decoration:none;
  font-size:12.5px;font-weight:600;transition:background .18s,border-color .18s,color .18s,box-shadow .22s}
.navlink:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-hover)}
/* Active page — matches index.html: accent tint + accent border + left bar + lit icon. */
.navlink.active{border-color:color-mix(in srgb,var(--accent) 58%,transparent);color:var(--text);
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--surface-2)),var(--bg-2));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent),
    0 10px 24px -16px color-mix(in srgb,var(--accent) 85%,transparent)}
.navlink.active svg{color:var(--accent)}
.navlink.active::before{content:"";position:absolute;left:-1px;top:50%;transform:translateY(-50%);
  width:3px;height:58%;border-radius:0 3px 3px 0;background:var(--accent);
  box-shadow:0 0 10px color-mix(in srgb,var(--accent) 75%,transparent)}
.navlink svg{width:16px;height:16px;flex:0 0 auto;transition:color .18s,transform .18s}
.navlink .arr{margin-left:auto;opacity:.45}
.app.collapsed .navlink.active{background:color-mix(in srgb,var(--accent) 24%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 50%,transparent),
    0 0 18px -6px color-mix(in srgb,var(--accent) 65%,transparent)}
.app.collapsed .navlink.active::before{display:none}
.spacer{flex:1}
.theme-toggle{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);cursor:pointer;
  border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--surface);transition:.18s}
.theme-toggle:hover{border-color:var(--border-strong);color:var(--text)}
.theme-toggle svg{width:16px;height:16px}
.theme-toggle .tk{margin-left:auto;font:600 9.5px/1 var(--mono);color:var(--muted-2);
  border:1px solid var(--border);border-radius:5px;padding:2px 5px}

/* ---------- collapsible rail ---------- */
.collapse-btn{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:0 0 auto;margin-left:auto;
  padding:0;transition:.18s}
.collapse-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-hover)}
.collapse-btn svg{width:15px;height:15px;transition:transform .32s cubic-bezier(.34,1.3,.64,1)}
.app.collapsed .sidebar{width:72px;flex:0 0 72px;padding:18px 12px;gap:14px}
.app.collapsed .brand{flex-direction:column;gap:10px;align-items:center}
.app.collapsed .brand-txt{display:none}
.app.collapsed .collapse-btn{margin-left:0}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}
.app.collapsed .wf-title{display:none}
.app.collapsed .nav-sec{align-items:center;width:100%}
.app.collapsed .navlink{justify-content:center;padding:10px 0;width:100%}
.app.collapsed .navlink span{display:none}
.app.collapsed .theme-toggle{justify-content:center;padding:10px 0}
.app.collapsed .theme-toggle span{display:none}
/* Rail animation, scoped to the transition window by toggleRail() so it does not
   replay on every load. Mirrors index.html. */
@keyframes railPop{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}
@keyframes railFade{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:translateX(0)}}
.app.rail-anim.collapsed .brand .mark,
.app.rail-anim.collapsed .navlink svg,
.app.rail-anim.collapsed .theme-toggle svg{animation:railPop .34s cubic-bezier(.34,1.34,.64,1) both}
.app.rail-anim.collapsed .navlink,
.app.rail-anim.collapsed .theme-toggle{animation:railFade .34s cubic-bezier(.4,0,.2,1) both}

/* ---------- search palette (Ctrl+K) ---------- */
.palette{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-start;justify-content:center;
  padding-top:12vh;background:rgba(4,10,18,.60);backdrop-filter:blur(3px)}
.palette[hidden]{display:none}
.palette-card{width:min(600px,92vw);background:var(--surface-2);border:1px solid var(--border-strong);
  border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);overflow:hidden}
.pal-field{display:flex;align-items:center;gap:11px;height:48px;padding:0 13px;border-bottom:1px solid var(--border)}
.pal-field .pf-ico{width:18px;height:18px;flex:0 0 auto;color:var(--muted-2);transition:.18s}
.pal-field:focus-within .pf-ico{color:var(--accent)}
.pal-field input{flex:1;min-width:0;height:100%;border:none;background:transparent;color:var(--text);
  font:inherit;font-size:13.5px;outline:none}
.pal-field input::placeholder{color:var(--muted-2)}
.palette-kbd{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.6px;
  color:var(--muted-2);border:1px solid var(--border);border-radius:6px;padding:3px 6px}
/* Pinned frequent filters — the same recipe as the Review Console palette. */
.pal-pins{display:flex;gap:8px;flex-wrap:wrap;padding:2px 12px 8px}
.pal-pin{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-3);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.pal-pin:hover,.pal-pin.active{border-color:var(--accent);color:var(--accent);background:var(--surface-hover)}
.pal-pin .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.pal-pin-c{font-size:10.5px;color:var(--muted-2);font-family:var(--mono);background:var(--surface-2);border-radius:999px;padding:1px 7px;margin-left:2px}
.pal-pin-k{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--muted-2);border-left:1px solid var(--border);margin-left:2px;padding-left:7px}
.pal-hint{margin:0 12px 10px;padding:9px 12px;border:1px dashed var(--border);border-radius:10px;font-size:12px;line-height:1.55;color:var(--muted-2);background:var(--surface-2)}
.pal-hint b{color:var(--text);font-weight:600}
.palette-list{max-height:52vh;overflow-y:auto;padding:6px}
.pal-group{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted-2);padding:10px 12px 4px}
.palette-list>.pal-group:first-child{padding-top:4px}
.palette-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted)}
.palette-item .pi-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--surface-3);border:1px solid var(--border);color:var(--accent)}
.palette-item .pi-ico svg{width:16px;height:16px}
.palette-item .pi-txt{flex:1;min-width:0}
.palette-item .pi-txt b{display:block;font-size:13px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette-item .pi-txt span{font-size:11.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette-item .pi-kbd{font-size:10.5px;color:var(--muted-2);border:1px solid var(--border);border-radius:6px;
  padding:2px 7px;font-family:var(--mono)}
.palette-item.active{background:var(--surface-hover)}
.palette-item.active .pi-ico{background:var(--grad);border-color:transparent;color:#fff}
.pal-empty{padding:24px 14px;text-align:center;color:var(--muted-2);font-size:12.5px;line-height:1.65}
.palette-hint{padding:9px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-2);
  display:flex;gap:14px;flex-wrap:wrap}
.palette-hint b{color:var(--muted);font-weight:600}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--surface-2),transparent);flex:0 0 auto}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.crumbs b{color:var(--text);font-weight:650}
.crumbs a{color:var(--accent);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex:0 0 auto}
/* .btn was shrinkable and had no nowrap, so below ~1240px the labels wrapped and the
   bar grew 56 -> 85px tall. */
.topbar .btn,.topbar .search-btn{white-space:nowrap;flex:0 0 auto}
.content{flex:1;overflow-y:auto;padding:18px 20px 28px}
/* Dashboard only: the KPI strip, the panel title bar and the filter chips are the
   context you navigate by, so they stay pinned and only the rows scroll under
   them. Without this, arrow-keying down the list scrolls the whole page and the
   numbers you are reading scroll off screen. */
.content.dash-mode{display:flex;flex-direction:column;overflow:hidden;padding-bottom:14px}
.content.dash-mode .kpi-bar,.content.dash-mode .panel-head,.content.dash-mode .dash-tools{flex:0 0 auto}
.content.dash-mode .panel{display:flex;flex-direction:column;flex:1;min-height:0;margin-bottom:0}
.dash-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.dash-scroll table.list thead th{z-index:2}
/* Fixed layout is what makes the dashboard rows uniform. With auto layout the mono
   file-name columns absorbed every width shortage by wrapping, so rows ranged from
   54px to 99px and the list looked ragged. Pin the five column widths and let the
   names ellipsise instead (the full value sits in the cell title). */
.dash-scroll table.list{table-layout:fixed}
.dash-scroll table.list th:nth-child(1),.dash-scroll table.list td:nth-child(1){width:22%}
.dash-scroll table.list th:nth-child(2),.dash-scroll table.list td:nth-child(2){width:14%}
.dash-scroll table.list th:nth-child(3),.dash-scroll table.list td:nth-child(3){width:14%}
.dash-scroll table.list th:nth-child(4),.dash-scroll table.list td:nth-child(4){width:32%}
.dash-scroll table.list th:nth-child(5),.dash-scroll table.list td:nth-child(5){width:18%}
.dash-scroll table.list td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-scroll table.list td>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- kpi ---------- */
.kpi-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.kpi{background:linear-gradient(160deg,var(--surface-2),var(--bg-2));border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi .num{font-size:24px;font-weight:750;letter-spacing:.3px}
.kpi .lbl{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.accent .num{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi::after{content:"";position:absolute;right:-22px;top:-22px;width:64px;height:64px;border-radius:50%;
  background:var(--grad);opacity:.10;filter:blur(6px)}

/* ---------- panel ---------- */
.panel{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.panel-head .ttl{font-size:13px;font-weight:650;display:flex;align-items:center;gap:8px}
.panel-head .ttl svg{width:16px;height:16px;color:var(--accent)}
.panel-head .count{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--surface-3);
  padding:3px 9px;border-radius:20px;border:1px solid var(--border)}
.panel-body{padding:14px 16px}

/* ---------- table ---------- */
table.list{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.list th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted-2);
  padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;position:sticky;top:0;background:var(--surface-2)}
table.list td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.list tbody tr{cursor:pointer;transition:.15s}
table.list tbody tr:hover{background:var(--surface-hover)}
table.list tbody tr:last-child td{border-bottom:0}
/* Keyboard / click selection — the arrow keys need something visible to move,
   so the highlight mirrors the inbox rows on the Review Console. */
table.list tbody tr.sel{background:color-mix(in srgb,var(--accent) 11%,transparent)}
table.list tbody tr.sel:hover{background:color-mix(in srgb,var(--accent) 17%,transparent)}
table.list tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
table.list tbody tr.sel .key{color:var(--accent)}
.key{font-weight:650;font-family:var(--mono);font-size:12px;color:var(--text)}
.sub{font-size:11px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}

/* ---------- pill ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:10.5px;font-weight:650;letter-spacing:.3px;white-space:nowrap;border:1px solid var(--bd);background:var(--bd2);color:var(--c)}
.pill.ok{--c:var(--ok);--bd:var(--ok-bd);--bd2:var(--ok-bg)}
.pill.warn{--c:var(--warn);--bd:var(--warn-bd);--bd2:var(--warn-bg)}
.pill.bad{--c:var(--bad);--bd:var(--bad-bd);--bd2:var(--bad-bg)}
.pill.neu{--c:var(--muted);--bd:var(--border);--bd2:var(--surface-3)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;
  padding:8px 13px;border-radius:9px;border:1px solid var(--border);background:var(--surface-3);color:var(--text);
  cursor:pointer;transition:.16s;line-height:1}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn.primary{background:var(--grad-btn);border:0;color:#fff;box-shadow:0 6px 16px -8px rgba(15,118,110,.6)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:15px;height:15px}

/* ---------- generic ---------- */
.muted{color:var(--muted)}
.small{font-size:11.5px}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* One designed focus ring for every control; :where() keeps specificity at 0 so
   hand-tuned rings (.grip, .search-btn, .att .lnk) still win where they exist. */
:where(.btn,.chip,.navlink,.subnav a,.pal-pin,.palette-item,.theme-toggle,a):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}
  /* Compact the KPI cards instead of stacking them to 2x2. */
  .kpi-bar{gap:8px}.kpi{padding:9px 11px}.kpi .num{font-size:20px}.kpi .lbl{font-size:10.2px}}
@media(max-width:780px){.kpi-bar{grid-template-columns:repeat(2,1fr)}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-size:12px}
.kv .v{font-weight:600;text-align:right}
.note{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;line-height:1.5}
.note.warn{border-left-color:var(--warn)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto}
.empty .big{display:block;font-weight:650;color:var(--text);font-size:14px;margin-bottom:4px}

/* ---------- version history ---------- */
.ver{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);margin-bottom:8px}

  padding:3px 6px;border-radius:7px;background:var(--surface-3);border:1px solid var(--border)}
.ver .fn{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ver .ix{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---------- version diff · compare bar ---------- */
/* Replaces two bare <select>s + an arrow: each side is now a labelled card that
   states its role (baseline vs counterpart) and its detected document type, and
   the middle control doubles as a swap button. */
.cmpbar{border:1px solid var(--border);border-radius:13px;padding:12px 13px 13px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface-3) 72%,transparent),var(--surface));
  margin-bottom:11px}
.cmpbar-top{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.cmpbar-top .ct{font-size:10.5px;font-weight:700;letter-spacing:1.15px;text-transform:uppercase;color:var(--muted-2)}
.cmpbar-top .chint{font-size:11px;color:var(--muted-2)}
.cmpbar-top .chint b{color:var(--muted);font-weight:650}
.cmpbar-top .cmp-go{margin-left:auto}
.cmprow{display:flex;align-items:stretch;gap:9px}
.cmp-tile{flex:1 1 0;min-width:0;border:1px solid var(--border);border-radius:11px;
  background:var(--surface-2);padding:9px 11px 11px;display:flex;flex-direction:column;gap:7px;
  transition:border-color .18s,box-shadow .18s}
.cmp-tile:hover{border-color:var(--border-strong)}
.cmp-tile:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent);
  box-shadow:0 0 0 3px var(--focus-ring)}
.cmp-head{display:flex;align-items:center;gap:7px;min-width:0}
.cmp-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--accent-2);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-2) 20%,transparent)}
.cmp-tile[data-doc="SI"] .cmp-dot{background:var(--accent-3);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-3) 20%,transparent)}
.cmp-tile[data-doc="—"] .cmp-dot{background:var(--muted-2);box-shadow:none}
.cmp-type{font:700 10.5px/1 var(--mono);letter-spacing:.7px;color:var(--text)}
.cmp-role{margin-left:auto;font-size:9.6px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted-2)}
.cmp-field{position:relative;display:flex;align-items:center}
.cmp-sel{appearance:none;-webkit-appearance:none;width:100%;height:33px;border:1px solid var(--border);
  border-radius:9px;background:var(--surface-3);color:var(--text);font:inherit;font-size:12.5px;
  padding:0 31px 0 10px;cursor:pointer;text-overflow:ellipsis;transition:border-color .18s,background .18s}
.cmp-sel:hover{border-color:var(--border-strong);background:var(--surface-hover)}
.cmp-sel optgroup{color:var(--muted-2);font-size:11px;letter-spacing:.6px}
.cmp-sel option{background:var(--surface-2);color:var(--text)}
.cmp-chev{position:absolute;right:9px;width:14px;height:14px;color:var(--muted-2);pointer-events:none}
.cmp-swap{flex:0 0 auto;align-self:center;width:34px;height:34px;display:grid;place-items:center;
  border:1px solid var(--border);border-radius:50%;background:var(--surface-2);color:var(--muted);
  cursor:pointer;transition:color .2s,border-color .2s,background .2s,transform .35s cubic-bezier(.4,0,.2,1)}
.cmp-swap:hover{color:var(--accent);background:var(--surface-hover);
  border-color:color-mix(in srgb,var(--accent) 55%,transparent);transform:rotate(180deg)}
.cmp-swap svg{width:16px;height:16px}
@media (max-width:760px){
  .cmprow{flex-wrap:wrap}
  .cmp-tile{flex:1 1 100%}
  .cmp-swap{align-self:flex-start;margin-left:2px;transform:rotate(90deg)}
}

/* ---------- version diff ---------- */
.diffrow{display:grid;grid-template-columns:140px 1fr 1fr 96px;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--border);align-items:center;font-size:13px}
.diffrow.head{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted-2);font-weight:600}
.diffrow .fld{font-weight:600}
.diffrow .val{font-family:var(--mono);font-size:12px;word-break:break-word}
.diffrow.unchanged .to{color:var(--muted)}
.diffrow.changed .to{color:var(--bad);font-weight:600}
.sev{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:6px;text-align:center}
.sev.ch{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-bd)}
.sev.uc{background:var(--surface-3);color:var(--muted);border:1px solid var(--border)}

/* ---------- issue / resolution ---------- */
.issue{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--surface)}
.issue .issue-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.issue .fld{font-weight:700;font-size:14px}
.issue .grid2x{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.valbox{border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:var(--surface-2)}
.valbox .l{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted-2);margin-bottom:4px}
.valbox .v{font-family:var(--mono);font-size:12.5px;word-break:break-word}
.explain{font-size:12.5px;color:var(--muted);line-height:1.5;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;padding:9px 11px;margin:6px 0}
.suggest{font-size:12.5px;background:color-mix(in srgb,var(--accent) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:9px;padding:9px 11px;margin:6px 0}
.suggest b{color:var(--accent)}
.issue-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.review-note{flex:1;min-width:140px}
.draft-card{border:1px solid var(--ok-bd);background:var(--ok-bg);border-radius:11px;padding:13px 15px;margin-top:8px}
.draft-card .dt{font-weight:700;color:var(--ok);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.draft-card .kv .v{font-family:var(--mono);font-size:11.5px}

/* ---------- AI placeholder ---------- */
.ai-card{opacity:.72}
.ai-card .coming{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ai-card .coming div{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.ai-card .coming div::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted-2);flex:0 0 auto}
.ai-note{font-size:11.5px;color:var(--muted-2);margin-top:8px;font-style:italic}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:11px 16px;border-radius:11px;
  box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--bad-bd);color:var(--bad)}
.toast.ok{border-color:var(--ok-bd)}
.toast svg{width:17px;height:17px;flex:0 0 auto}

/* ---------- keyboard hint chips ---------- */
.hk{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;font-weight:600;line-height:1;color:var(--muted-2);
  border:1px solid var(--border);border-radius:5px;padding:3px 5px;background:var(--surface-3);transition:.16s}
.navlink .hk{margin-left:auto}
.navlink:hover .hk,.navlink.active .hk{color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
.btn .hk{border-color:var(--border-strong);background:transparent}
.btn:hover .hk{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* ---------- contextual tooltip ---------- */
.tip{position:fixed;left:-9999px;top:0;z-index:95;pointer-events:none;max-width:290px;
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:11px;
  padding:9px 12px;box-shadow:var(--shadow);opacity:0;visibility:hidden;
  transition:opacity .14s ease,visibility .14s}
.tip.show{opacity:1;visibility:visible}
.tip .tip-t{font-size:12.5px;font-weight:650;color:var(--text);line-height:1.3}
.tip .tip-d{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:3px}
.tip .tip-k{margin-top:7px;display:flex;gap:5px;align-items:center}
.tip .tip-k b{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:5px;padding:2px 6px}

/* ---------- shortcut sheet ( ? ) ---------- */
.help{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(4,10,18,.62);backdrop-filter:blur(3px)}
.help[hidden]{display:none}
.help-card{width:min(520px,94vw);max-height:82vh;overflow:auto;background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.help-head{position:sticky;top:0;display:flex;align-items:center;gap:9px;padding:14px 16px;
  border-bottom:1px solid var(--border);background:var(--surface-2)}
.help-head .ttl{font-size:13px;font-weight:650;display:flex;align-items:center;gap:8px}
.help-head .ttl svg{width:16px;height:16px;color:var(--accent)}
.help-head .x{margin-left:auto;width:26px;height:26px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);cursor:pointer;font:inherit;font-size:13px;line-height:1}
.help-head .x:hover{color:var(--text);border-color:var(--border-strong)}
.help-body{padding:8px 10px 14px}
.help-row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:9px;transition:.15s}
.help-row:hover{background:var(--surface-hover)}
.help-row .ht{flex:1;min-width:0}
.help-row .ht b{display:block;font-size:12.5px;font-weight:650;color:var(--text)}
.help-row .ht span{font-size:11.5px;color:var(--muted-2)}
.help-row .kk{display:flex;gap:4px;flex:0 0 auto}
.help-row .kk b{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:5px;padding:3px 7px}
.help-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-2)}

/* ---------- dashboard tools (filter + sort) ---------- */
.dash-tools{display:flex;gap:18px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--border);background:transparent}
.dt-hint{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted-2);white-space:nowrap}
.dt-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dt-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted-2);font-weight:700;margin-right:2px}
.chip{font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface);
  border:1px solid var(--border);border-radius:999px;padding:4px 11px;cursor:pointer;transition:.14s;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.dash-head{display:flex;align-items:center;gap:12px;margin-left:auto}
.dash-head .count{font-size:12px;color:var(--muted)}
.dash-head .updated{font-size:11px;color:var(--muted-2);font-family:var(--mono)}
.list th[data-sort]:hover{color:var(--accent);background:var(--surface-hover)}

/* ---------- detail section nav (lives inside the topbar) ----------
   Mounted next to the breadcrumb instead of inside the scroll container, so it can
   never overlap the first panel, and no sticky band can let content ghost through. */
.subnav{display:flex;align-items:center;gap:4px;margin-left:4px;padding-left:12px;
  border-left:1px solid var(--border);min-width:0;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none}
.subnav[hidden]{display:none}
.subnav::-webkit-scrollbar{display:none}

  padding:4px 11px;border-radius:999px;border:1px solid transparent;white-space:nowrap;transition:.14s}
.subnav a:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 42%,transparent);
  background:color-mix(in srgb,var(--accent) 9%,transparent)}
.subnav a.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  background:color-mix(in srgb,var(--accent) 15%,transparent)}
/* Below ~1280px crumbs + 5 anchors + 2 buttons cannot share one line. Previously the
   anchors silently clipped (Resolution cut mid-word, AI invisible) with the scrollbar
   hidden, so there was no affordance at all. Drop the nav to a second row instead:
   same continuous surface, nothing hidden. */

  .topbar{flex-wrap:wrap;row-gap:9px}
  .subnav{order:3;flex:1 0 100%;margin-left:0;padding-left:0;padding-top:9px;
    border-left:0;border-top:1px solid var(--border)}

.btn.ghost:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-hover)}
.btn.sm{padding:6px 11px;font-size:12px;gap:6px}
.btn.sm svg{width:14px;height:14px}

    transition-duration:.001ms!important;scroll-behavior:auto!important}

<script>
const API = "";
const FIELDS = [
  ["shipper","Shipper"],
  ["consignee","Consignee"],
  ["notify_party","Notify Party"],
  ["port_of_loading","Port of Loading"],
  ["port_of_discharge","Port of Discharge"],
  ["container_count","Container Count"],
  ["gross_weight_kg","Gross Weight"],
];
const FMAP = Object.fromEntries(FIELDS.map(f => [f[0], f[1]]));
const RESOLVE_STATES = ["VERIFIED","NEEDS_REVIEW","IN_PROGRESS","PENDING_APPROVAL","RESOLVED"];

let state = { shipments: [], current: null, versions: [], issues: [], status: null, diff: null, draft: null, dashSel: 0 };
const view = document.getElementById("view");

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function isTyping(t){ return t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"); }
function fmtVal(field, val){
  if(val===null||val===undefined||val==="") return "—";
  if(field==="gross_weight_kg"){ const n=Number(val); return (isFinite(n)?n.toLocaleString():"")+" kg"; }
  if(field==="container_count"){ const n=Number(val); return isFinite(n)?String(n):String(val); }
  return String(val);
}
function statusKind(s){
  s=String(s||"").toUpperCase();
  if(["VERIFIED","RESOLVED","APPROVED"].includes(s)) return "ok";
  if(["PENDING_APPROVAL","NEEDS_REVIEW","IN_PROGRESS","SUGGESTED","OPEN"].includes(s)) return "warn";
  if(["REJECTED"].includes(s)) return "bad";
  return "neu";
}
function pill(text, kind){ return '<span class="pill '+(kind||"neu")+'">'+esc(text)+'</span>'; }
function statusPill(s){ return pill(s, statusKind(s)); }

/* Independent resolution signal derived from the per-shipment counts the API
   already returns. This is NOT the same axis as Verification (which answers
   "do the SI/BL agree?") — this answers "has a human acted on the issues?". */
function resolutionState(sh){
  const pend=sh.pending_count||0, res=sh.resolved_count||0, mm=sh.mismatch_count||0;
  if(res>0)   return {label:"Resolved",   kind:"ok",   sub: res+(pend?(" · "+pend+" pending"):"")};
  if(pend>0)  return {label:"Pending",    kind:"warn", sub: pend+(res?(" · "+res+" resolved"):"")};
  if(mm>0)    return {label:"Unresolved", kind:"bad",  sub: mm+" mismatch"+(mm>1?"es":"")};
  return {label:"Clear", kind:"neu", sub:""};
}
function resRank(r){ return ({Resolved:4, Pending:3, Unresolved:2, Clear:1})[r.label] || 0; }
/* Show the trade lane instead of reprinting the reference (which the key row
   already displays). Falls back to the shipper if ports are absent. */
function routeOf(si,bl){
  const f=(si&&si.extracted_fields)||(bl&&bl.extracted_fields)||{};
  const a=String(f.port_of_loading||"").trim(), b=String(f.port_of_discharge||"").trim();
  if(a||b) return (a||"?")+" → "+(b||"?");
  const p=String(f.shipper||f.consignee||"").trim();
  return p;
}
/* Strip the noisy shared prefix ("attachments/email_046_") from stored names. */
function fmtFile(name){ return name? String(name).replace(/^attachments\//,"").replace(/^email_\d+_/,"") : "—"; }
function fmtTime(d){ try{ return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}); }catch(_){ return ""; } }

/* ---------- keyboard map for the dashboard filters ---------- */
/* One table drives the chip shortcut, the hover bubble and the `?` cheat-sheet
   so the three can never disagree. Plain letters pick a Verification state,
   Shift+letter picks a Resolution state — two independent axes, two groups. */
/* Platform-aware modifier label — the same convention MODK already uses for the
   search key: a Windows user reads "Shift", a Mac user reads the ⇧ glyph. The
   bare "⇧" was unreadable for anyone not raised on Mac keycaps, so the word wins.
   SHIFT_TIP appends the "|" the tooltip and cheat-sheet renderers split on, so the
   modifier and the letter become two separate keycaps — exactly how the Search
   button already draws [Ctrl][K]. */
const IS_MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||"");
const MODK=IS_MAC?"\u2318":"Ctrl";
const SHIFTK=IS_MAC?"\u21e7":"Shift";
const SHIFT_TIP=SHIFTK+"|";
/* One-keycap form ("Shift+A") for the palette rows and the pinned filter chips,
   which render a single badge — a second keycap would double their width. */
const kbdOne=s=>String(s||"").replace("|","+");
/* Dashboard filter shortcuts. Plain letter = Verification axis, Shift+letter =
   Resolution axis. The chip tooltip, the `?` cheat-sheet and the keydown handler all
   read from here, so they can never disagree. */
const FILTER_KEYS = {
  ver: {
    all:    ["A", "Verification filter", "Show every shipment regardless of SI<->BL agreement"],
    ok:     ["V", "Verification filter", "Show only shipments whose SI and BL already agree"],
    review: ["N", "Verification filter", "Show only shipments with a detected mismatch"]
  },
  res: {
    all:        [SHIFT_TIP+"A", "Resolution filter", "Ignore the resolution state (show everything)"],
    clear:      [SHIFT_TIP+"C", "Resolution filter", "Show shipments with no open issues"],
    unresolved: [SHIFT_TIP+"U", "Resolution filter", "Show issues detected but not yet actioned"],
    pending:    [SHIFT_TIP+"P", "Resolution filter", "Show suggestions waiting for your decision"],
    resolved:   [SHIFT_TIP+"R", "Resolution filter", "Show shipments where every issue is resolved"]
  }
};
/* Human label + dot colour per filter. Drives both the searchable "Filters"
   group and the pinned "Your frequent filters" row. */
const FILTER_LABEL = {
  "ver:all":       ["Any verification", "var(--muted-2)"],
  "ver:ok":        ["Verified",         "var(--ok)"],
  "ver:review":    ["Needs review",     "var(--warn)"],
  "res:all":       ["Any resolution",   "var(--muted-2)"],
  "res:clear":     ["Clear",            "var(--ok)"],
  "res:unresolved":["Unresolved",       "var(--bad)"],
  "res:pending":   ["Pending",          "var(--warn)"],
  "res:resolved":  ["Resolved",         "var(--ok)"]
};
/* Free-text triggers, so a filter can be found by word and not just by name. */
const FILTER_ALIASES = {
  "ver:ok":        ["verified","verify","ok","agree","match","clean","pass"],
  "ver:review":    ["review","mismatch","mismatches","needs","flag","issue","problem","differ"],
  "res:clear":     ["clear","no issues","nothing open","clean"],
  "res:unresolved":["unresolved","open","todo","outstanding"],
  "res:pending":   ["pending","approval","waiting","suggest"],
  "res:resolved":  ["resolved","done","closed","complete","handled"]
};
/* Which filters you actually reach for — the same pinning idea as the Review
   Console's status chips, so both palettes learn from real use. */
const FREQ_KEY="sdoc_ship_filter_freq";
function filterFreq(){try{return JSON.parse(localStorage.getItem(FREQ_KEY)||"{}");}catch(_){return {};}}
function recordFilterUse(grp,val){
  const m=filterFreq(), k=grp+":"+val;
  m[k]=(m[k]||0)+1;
  try{localStorage.setItem(FREQ_KEY,JSON.stringify(m));}catch(_){}
}
function topFilters(n){
  return Object.keys(filterFreq())
    .filter(k=>FILTER_LABEL[k])
    .sort((a,b)=>filterFreq()[b]-filterFreq()[a])
    .slice(0,n)
    .map(k=>({key:k,count:filterFreq()[k]}));
}
/* Recently opened shipments, so the palette can offer real recents like the
   Review Console does for emails. */
const SHIP_RECENT_KEY="sdoc_ship_recent_v1";
function recentShipIds(){try{return JSON.parse(localStorage.getItem(SHIP_RECENT_KEY)||"[]");}catch(_){return [];}}
function recordRecentShip(id){
  let a=recentShipIds().filter(x=>x!==id);
  a.unshift(id); a=a.slice(0,6);
  try{localStorage.setItem(SHIP_RECENT_KEY,JSON.stringify(a));}catch(_){}
}
/* Shortcut metadata for action buttons, keyed by data-act: [key, title, desc]. */
const ACT_KEYS = {
  "compare":      ["C",      "Compare versions",     "Run the deterministic 7-field comparison of the two selected versions"],
  "swap":         ["S",      "Swap sides",           "Exchange the From and To versions"],
  "suggest":      [SHIFT_TIP+"S", "Suggest correction",  "Generate a deterministic correction for the first open issue"],
  "approve":      ["A",      "Approve correction",   "Accept the suggested correction for the first open issue"],
  "reject":       ["X",      "Reject correction",    "Reject the suggested correction for the first open issue"],
  "draft":        ["D",      "Generate draft",       "Build the working BL draft from the approved resolutions"],
  "refresh-dash": ["R",      "Refresh list",         "Re-fetch the shipment list from the API"]
};
/* Build the full data-tip* attribute string for an action button. */
function actAttrs(act){
  const m=ACT_KEYS[act];
  if(!m) return "";
  return ' data-tip="'+esc(m[1])+'" data-tip-desc="'+esc(m[2])+'"'+
         ' data-tip-kbd="'+esc(m[0])+'" data-tip-pos="bottom"';
}
/* Filter chips re-render the dashboard, so keep the setter in one place. */
function setDashFilter(grp, val){
  state.dashFilter = state.dashFilter || {ver:"all", res:"all"};
  state.dashFilter[grp]=val;
  recordFilterUse(grp,val);
  state.dashSel=0;
  /* Called from the palette this may run while a shipment is open — hand back to
     the router instead of painting the dashboard underneath the detail view. */
  if(state.current) go("#/"); else paintDashboard();
}
/* Click a rendered action button (so keyboard and mouse share one code path).
   Returns false when the control is absent or disabled, e.g. the draft button
   before any suggestion has been approved. */
function pressAct(name){
  const b=document.querySelector('[data-act="'+name+'"]');
  if(!b || b.disabled) return false;
  b.click();
  return true;
}
function refreshView(){
  if(state.current) openShipment(state.current.id);
  else renderDashboard();
  toast("Refreshed from the API","ok");
}

async function api(path, opts){
  const res = await fetch(API+path, Object.assign({headers:{"Content-Type":"application/json"}}, opts||{}));
  let data=null; try{ data = await res.json(); }catch(_){}
  if(!res.ok){
    const msg = (data && (data.detail||data.message)) || ("HTTP "+res.status);
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return data;
}

function toast(msg, type){
  const t=document.getElementById("toast");
  t.className="toast"+(type?" "+type:"");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove("show"), 3400);
}

function icon(name){
  const I={
    ship:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18l-2 4H5zM5 17V9a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8"/><path d="M12 7V3M3 13h18"/></svg>',
    layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></svg>',
    compare:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 9v6M18 3a3 3 0 0 1 0 6M18 15a3 3 0 0 1 0 6M18 9a9 9 0 0 1-9 9"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
    bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M13 4l4 4-4 4M20 16H7M11 12l-4 4 4 4"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    rail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h12M3 19h18"/></svg>',
    refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.3 2"/></svg>',
    filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8.4V20l-4-2.2v-4.4z"/></svg>'
  };
  return I[name]||"";
}
function emptyCard(title, sub, ic){
  return '<div class="empty">'+(ic||icon("doc"))+'<span class="big">'+esc(title)+'</span>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</div>';
}
function errorCard(title, msg){
  return '<div class="panel"><div class="panel-body">'+icon("alert")+
    '<div class="big" style="font-weight:650;margin:6px 0 2px">'+esc(title)+'</div>'+
    '<div class="muted small">'+esc(msg||"")+'</div></div></div>';
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash || "#/";
  if(h.indexOf("#/s/")===0){
    const id = parseInt(h.slice(4),10);
    if(id>0){ openShipment(id); return; }
  }
  state.dashSel = 0;
  renderDashboard();
}
window.addEventListener("hashchange", route);

/* ---------- dashboard ---------- */
async function renderDashboard(){
  view.innerHTML = emptyCard("Loading shipments…","",icon("ship"));
  try{
    const data = await api("/shipments");
    state.shipments = data.shipments || [];
    paintDashboard();
  }catch(e){
    view.innerHTML = errorCard("Could not load shipments", e.message);
  }
}
function paintDashboard(){
  const s = state.shipments;
  view.classList.remove("dash-mode");   /* loading / empty states scroll normally */
  state.current = null;   /* leaving detail view — keeps the palette's context commands accurate */
  clearSubnav();
  document.getElementById("crumbs").innerHTML = '<b>Shipments</b>';
  if(s.length===0){
    view.innerHTML =
      '<div class="panel"><div class="panel-body">'+
      emptyCard("No shipments yet",
        "Shipments are created when inbox emails are processed (SI + BL compared). Run processing, then return here.",
        icon("ship"))+
      '</div></div>';
    return;
  }
  const total=s.length;
  state.dashFilter = state.dashFilter || {ver:"all", res:"all"};
  state.dashSort   = state.dashSort   || {key:"id", dir:1};
  state.dashUpdated = new Date();

  // ---- filter ----
  const fv=state.dashFilter.ver, fr=state.dashFilter.res;
  let rowsArr = s.filter(sh=>{
    const res=resolutionState(sh);
    if(fv==="ok"    && sh.mismatch_count>0) return false;
    if(fv==="review"&& sh.mismatch_count===0) return false;
    if(fr!=="all"  && res.label.toLowerCase()!==fr) return false;
    return true;
  });
  // ---- sort ----
  const so=state.dashSort;
  rowsArr.sort((a,b)=>{
    let c=0;
    if(so.key==="key") c=String(a.shipment_key).localeCompare(String(b.shipment_key));
    else if(so.key==="ver") c=(a.mismatch_count>0?1:0)-(b.mismatch_count>0?1:0);
    else if(so.key==="res") c=resRank(resolutionState(a))-resRank(resolutionState(b));
    else c=(a.id||0)-(b.id||0);
    return c*so.dir;
  });

  const withMismatch=s.filter(x=>x.mismatch_count>0).length;
  const pending=s.filter(x=>x.pending_count>0).length;
  const resolved=s.filter(x=>x.resolved_count>0).length;

  const sm=k=> (state.dashSort.key===k ? (state.dashSort.dir>0?" ▲":" ▼") : "");
  /* Each chip carries its own shortcut + hover bubble, sourced from FILTER_KEYS. */
  const chip=(grp,val,label)=>{
    const meta=FILTER_KEYS[grp][val]||["",""];
    const axis=(grp==="ver"?"Verification":"Resolution");
    return '<button class="chip'+(state.dashFilter[grp]===val?" on":"")+'" data-act="f'+grp+'" data-val="'+val+'"'+
      ' data-tip="'+esc(axis)+" \u00b7 "+esc(label)+'" data-tip-desc="'+esc(meta[2]||meta[1])+'"'+
      ' data-tip-kbd="'+esc(meta[0])+'" data-tip-pos="bottom" aria-label="Filter: '+esc(axis)+" "+esc(label)+'">'+
      esc(label)+'</button>';
  };

  /* Clamp the keyboard highlight to the rows that survived the filter, so the
     arrow keys can never point at a row that is no longer on screen. */
  state.dashSel = rowsArr.length ? Math.max(0, Math.min(state.dashSel|0, rowsArr.length-1)) : -1;
  const selIdx = state.dashSel;

  let rows="", ri=0;
  for(const sh of rowsArr){
    const si=sh.si_latest, bl=sh.bl_latest;
    const ver = sh.status || "VERIFIED";
    const res = resolutionState(sh);
    const rt  = routeOf(si,bl);
    rows += '<tr data-id="'+sh.id+'"'+(ri++===selIdx?' class="sel"':'')+'>'+
      '<td title="'+esc(sh.shipment_key)+(rt?' \u00b7 '+esc(rt):'')+'"><div class="key">'+esc(sh.shipment_key)+'</div><div class="sub">'+esc(rt||(sh.reference_number||"no ref"))+'</div></td>'+
      '<td class="mono" title="'+esc(si?si.filename:"")+'">'+esc(fmtFile(si?si.filename:null))+'</td>'+
      '<td class="mono" title="'+esc(bl?bl.filename:"")+'">'+esc(fmtFile(bl?bl.filename:null))+'</td>'+
      (()=>{const vtxt=ver+' \u00b7 '+(sh.mismatch_count>0? sh.mismatch_count+" mismatch"+(sh.mismatch_count>1?"es":""):"OK");
        const rtxt=res.label+' \u00b7 '+(res.sub||"no issues");
        return '<td title="'+esc(vtxt)+'">'+statusPill(ver)+' <span class="muted small">'+esc(sh.mismatch_count>0? sh.mismatch_count+" mismatch"+(sh.mismatch_count>1?"es":""):"OK")+'</span></td>'+
      '<td title="'+esc(rtxt)+'">'+pill(res.label,res.kind)+' <span class="muted small">'+esc(res.sub||"no issues")+'</span></td>';})()+
      '</tr>';
  }

  view.classList.add("dash-mode");
  view.innerHTML =
    '<div class="kpi-bar">'+
      kpi(total,"Shipments","accent")+
      kpi(withMismatch,"With mismatches")+
      kpi(pending,"Pending resolution")+
      kpi(resolved,"Resolved")+
    '</div>'+
    '<div class="panel"><div class="panel-head"><div class="ttl">'+icon("ship")+'Shipment Dashboard</div>'+
      '<div class="dash-head"><span class="count">'+rowsArr.length+' / '+total+' shipments</span>'+
      '<div class="dt-hint" data-tip="Move through the list" data-tip-desc="Arrow keys move the row highlight, Enter opens the shipment" data-tip-pos="bottom"><b class="hk">\u2191</b><b class="hk">\u2193</b>select<b class="hk">Enter</b>open</div>'+
      '<span class="updated" id="dashUpdated"></span>'+
      '<button class="btn ghost sm" data-act="refresh-dash" aria-label="Refresh shipments"'+actAttrs("refresh-dash")+'>'+icon("refresh")+'Refresh</button></div>'+
      '</div>'+
      '<div class="dash-tools">'+
        '<div class="dt-group"><span class="dt-label">Verification</span>'+chip("ver","all","All")+chip("ver","ok","Verified")+chip("ver","review","Needs review")+'</div>'+
        '<div class="dt-group"><span class="dt-label">Resolution</span>'+chip("res","all","All")+chip("res","clear","Clear")+chip("res","unresolved","Unresolved")+chip("res","pending","Pending")+chip("res","resolved","Resolved")+'</div>'+
      '</div>'+
      '<div class="dash-scroll" id="dashScroll">'+
      '<table class="list"><thead><tr>'+
        '<th data-sort="key" style="cursor:pointer">Shipment'+sm("key")+'</th>'+
        '<th>Latest SI</th><th>Latest BL</th>'+
        '<th data-sort="ver" style="cursor:pointer">Verification'+sm("ver")+'</th>'+
        '<th data-sort="res" style="cursor:pointer">Resolution'+sm("res")+'</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table>'+
      (rowsArr.length===0?'<div class="muted small" style="padding:14px 16px">No shipments match the current filters.</div>':'')+
      '</div>'+
    '</div>';

  const uEl=document.getElementById("dashUpdated");
  if(uEl) uEl.textContent = "Updated "+fmtTime(state.dashUpdated);

  view.querySelectorAll("tbody tr").forEach((tr,i)=>{
    tr.addEventListener("click",()=>{ state.dashSel=i; location.hash = "#/s/"+tr.dataset.id; });
  });
}
function kpi(num,label,accent){
  return '<div class="kpi '+(accent||"")+'"><div class="num">'+num+'</div><div class="lbl">'+esc(label)+'</div></div>';

/* ---------- shipment detail ---------- */
async function openShipment(id){
  view.classList.remove("dash-mode");
  view.innerHTML = emptyCard("Loading shipment #"+id+"…","",icon("layers"));
  try{
    const [det, iss, st] = await Promise.all([
      api("/shipments/"+id),
      api("/shipments/"+id+"/issues"),
      api("/shipments/"+id+"/resolution-status").catch(()=>({status:"UNKNOWN",total_issues:0,resolved:0,pending_approval:0,rejected:0}))
    ]);
    state.current = det;
    recordRecentShip(det.id);
    state.versions = (det.documents||[]).flatMap(d=>d.versions||[]);
    state.issues = iss||[];
    state.status = st;
    state.diff = null;
    state.draft = null;
    for(const it of state.issues){
      try{ const d = await api("/issues/"+it.id); it._res = d.resolution; }
      catch(_){ it._res = null; }
    }
    renderDetail();
  }catch(e){
    if(e.status===404){
      view.innerHTML = errorCard("Shipment not found", "No shipment with id "+id+". It may not have been generated yet — process inbox emails first.");
    }else{
      view.innerHTML = errorCard("Could not load shipment", e.message);
    }
  }
}

function findVer(vid){ return state.versions.find(v=>v.id===vid); }
function verLabel(v){ return v? (v.doc_type+" v"+v.version_number) : "?"; }
/* One side of the compare bar: role ("Baseline" / "Counterpart") + detected doc
   type, then the version <select>. `selId` must stay `fromSel` / `toSel` — the
   diff, the swap button and the auto-compare all look the selects up by id. */
function cmpTile(selId, role, selectedId, opts){
  const v=findVer(+selectedId)||{};
  const dt=(v.doc_type||"—").toUpperCase();
  return '<label class="cmp-tile" data-doc="'+esc(dt)+'">'+
    '<span class="cmp-head">'+
      '<span class="cmp-dot"></span>'+
      '<span class="cmp-type" data-type-slot="'+selId+'">'+esc(dt)+'</span>'+
      '<span class="cmp-role">'+esc(role)+'</span>'+
    '</span>'+
    '<span class="cmp-field">'+
      '<select id="'+selId+'" class="cmp-sel" aria-label="'+esc(role)+' version">'+opts+'</select>'+
      '<span class="cmp-chev">'+icon("chev")+'</span>'+
    '</span>'+
  '</label>';
}
/* Keep the tile chrome honest when the <select> changes: the type chip and the
   dot colour must follow whatever document is actually selected. */
function syncCompareBar(){
  ["fromSel","toSel"].forEach(function(id){
    const sel=document.getElementById(id);
    if(!sel) return;
    const tile=sel.closest(".cmp-tile");
    if(!tile) return;
    const opt=sel.options[sel.selectedIndex];
    const dt=(opt&&opt.dataset.type)||"—";
    tile.dataset.doc=dt;
    const slot=tile.querySelector('.cmp-type[data-type-slot="'+id+'"]');
    if(slot) slot.textContent=dt;
  });
}
function swapCompare(){
  const fs=document.getElementById("fromSel"), ts=document.getElementById("toSel");
  if(!fs||!ts) return;
  const a=fs.value; fs.value=ts.value; ts.value=a;
  syncCompareBar();
  compareVersions();
}

/* ---------- topbar section nav ------------------------------------------
   Titles mirror each panel's own heading so the tab and the panel can never drift. */
const subnavEl = document.getElementById("subnav");
function clearSubnav(){ if(subnavEl){ subnavEl.hidden = true; subnavEl.innerHTML = ""; } }
function setSubnav(items){
  if(!subnavEl) return;
  subnavEl.innerHTML = items.map(it =>
    '<a href="#'+it[0]+'" data-sec="'+it[0]+'" title="'+esc(it[2])+'">'+esc(it[1])+'</a>').join("");
  subnavEl.hidden = false;
  requestAnimationFrame(scrollSpy);
}
/* Scroll the panel to the top of #view itself. Computing the offset is predictable —
   scrollIntoView on a nested scroller depends on ancestor overflow and can land
   anywhere, and the offset stays correct while a smooth scroll is in flight. */
function goSection(id){
  const el = document.getElementById(id); if(!el) return false;
  const box = document.getElementById("view"); if(!box) return false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const top = el.getBoundingClientRect().top - box.getBoundingClientRect().top
              + box.scrollTop - 8;
  box.scrollTo({top: Math.max(0, top), behavior: reduce ? "auto" : "smooth"});
  subnavEl && subnavEl.querySelectorAll("a").forEach(a =>
    a.classList.toggle("on", a.dataset.sec === id));
  return false;
}
/* Park the highlighted row inside the dashboard's own scroller. `block:"nearest"`
   scrollIntoView will happily tuck the row underneath the sticky <thead>, so the
   offsets are computed explicitly - the same approach as goSection(). */
function keepRowVisible(row){
  const box = document.getElementById("dashScroll");
  if(!box){ row.scrollIntoView({block:"nearest"}); return; }
  const head = box.querySelector("thead");
  const headH = head ? head.getBoundingClientRect().height : 0;
  const rb = row.getBoundingClientRect(), cb = box.getBoundingClientRect();
  const top = rb.top - cb.top + box.scrollTop;
  const bot = rb.bottom - cb.top + box.scrollTop;
  if(rb.top < cb.top + headH) box.scrollTo({top: Math.max(0, top - headH - 6), behavior:"auto"});
  else if(rb.bottom > cb.bottom) box.scrollTo({top: bot - box.clientHeight + 6, behavior:"auto"});
}
/* Highlight whichever section is currently at the top of the scroll container. */
function scrollSpy(){
  if(!subnavEl || subnavEl.hidden) return;
  const box = document.getElementById("view"); if(!box) return;
  const top = box.getBoundingClientRect().top;
  const links = subnavEl.querySelectorAll("a");
  let best = null;
  links.forEach(a => {
    const sec = document.getElementById(a.dataset.sec);
    if(sec && sec.getBoundingClientRect().top - top <= 28) best = a;
  });
  /* Nothing crossed the line yet → the first section is the one you are looking at. */
  if(!best && links.length) best = links[0];
  links.forEach(a => a.classList.toggle("on", a === best));
}
if(subnavEl){
  subnavEl.addEventListener("click", e => {
    const a = e.target.closest("a[data-sec]"); if(!a) return;
    e.preventDefault(); goSection(a.dataset.sec);
  });
  const box = document.getElementById("view");
  if(box) box.addEventListener("scroll", scrollSpy, {passive:true});
  window.addEventListener("resize", scrollSpy);
}

      '<span class="count">coming soon</span></div>'+

function renderResolutionCenter(){
  let body;
  if(state.issues.length===0){
    body = emptyCard("No open issues for this shipment","All 7 tracked fields matched, or no comparison data available.",icon("check"));
  }else{
    let cards="";
    for(const it of state.issues){
      cards += issueCard(it);
    }
    body = cards;
  }
  return '<div class="panel" id="sec-resolution"><div class="panel-head"><div class="ttl">'+icon("alert")+'Resolution Center</div>'+
    '<span class="count">'+(state.issues.filter(i=>(i._res && (i._res.status==="PENDING_APPROVAL"))||i.status==="PENDING_APPROVAL"||i.status==="SUGGESTED").length)+' open</span></div>'+
    '<div class="panel-body">'+body+'</div></div>';
}
function issueCard(it){
  const field=it.field_name;
  const label=FMAP[field]||field;
  const res=it._res;

  if(res){
    sugg = 'Update BL <b>'+esc(label)+'</b> to <b>'+esc(fmtVal(field,res.suggested_value))+'</b>';
  }else{
    sugg = 'No suggestion yet — click <b>Suggest</b> to generate a deterministic correction.';
  }
  const resStatus = res? statusPill(res.status) : '<span class="muted small">no resolution record</span>';
  return '<div class="issue">'+
    '<div class="issue-head"><span class="fld">'+esc(label)+'</span>'+statusPill(it.status)+resStatus+'</div>'+
    '<div class="grid2x">'+
      '<div class="valbox"><div class="l">SI value</div><div class="v">'+esc(fmtVal(field,it.si_value))+'</div></div>'+
      '<div class="valbox"><div class="l">BL value</div><div class="v">'+esc(fmtVal(field,it.bl_value))+'</div></div>'+
    '</div>'+
    '<div class="explain"><b>Difference:</b> '+esc(it.difference||"—")+'<br><b>Explanation:</b> '+esc(it.explanation||"—")+'</div>'+
    '<div class="suggest">'+sugg+'</div>'+
    '<div class="issue-actions">'+
      '<button class="btn" data-act="suggest" data-id="'+it.id+'"'+actAttrs("suggest")+'>Suggest</button>'+
      '<button class="btn primary" data-act="approve" data-id="'+it.id+'"'+actAttrs("approve")+'>Approve</button>'+
      '<button class="btn" data-act="reject" data-id="'+it.id+'"'+actAttrs("reject")+'>Reject</button>'+
      '<input class="btn review-note" type="text" placeholder="optional review note…" />'+
    '</div>'+
  '</div>';
}

async function compareVersions(){
  const fs=document.getElementById("fromSel"), ts=document.getElementById("toSel");
  const box=document.getElementById("diffOut");
  if(!fs||!ts) return;
  const from=+fs.value, to=+ts.value;
  if(!from||!to){ box.innerHTML='<div class="muted small">Select two versions to compare.</div>'; return; }
  box.innerHTML='<div class="muted small">Comparing…</div>';
  try{
    const d = await api("/shipments/"+state.current.id+"/version-diff?from_version_id="+from+"&to_version_id="+to);
    state.diff=d.fields;
    let rows='<div class="diffrow head"><div>Field</div><div>'+esc(verLabel(findVer(from)))+'</div><div>'+esc(verLabel(findVer(to)))+'</div><div>Status</div></div>';
    for(const f of FIELDS){
      const cell = d.fields.find(x=>x.field===f[0]) || {field:f[0],from_value:null,to_value:null,changed:false};
      const ch = cell.changed;
      rows += '<div class="diffrow '+(ch?"changed":"unchanged")+'">'+
        '<div class="fld">'+esc(f[1])+'</div>'+
        '<div class="val">'+esc(fmtVal(f[0],cell.from_value))+'</div>'+

async function doAction(act, id, comment){
  try{
    const body = (act==="suggest") ? {} : {reviewed_by:"human", review_comment: comment||null};
    await api("/issues/"+id+"/"+act, {method:"POST", body:JSON.stringify(body)});
    toast("Issue #"+id+" · "+act+" recorded","ok");
    await openShipment(state.current.id);
  }catch(e){
    toast("Action failed: "+e.message,"err");
  }
}

function renderResolutionStatus(){

    draftHtml='<div class="draft-card"><div class="dt">'+icon("doc")+'Generated Draft</div>'+
      '<div class="kv"><span class="k">corrected_draft_path</span><span class="v">'+esc(d.corrected_draft_path)+'</span></div>'+
      '<div class="kv"><span class="k">source_bl_version_id</span><span class="v">'+esc(d.source_bl_version_id)+'</span></div>'+

      '<div class="note" style="margin-top:8px">This is a generated working draft only. It is not an official Bill of Lading, has not been sent to any party, and the original document is unchanged.</div>'+

      '<div class="kv"><span class="k">Pending approval</span><span class="v">'+st.pending_approval+'</span></div>'+
      '<div class="kv"><span class="k">Rejected</span><span class="v">'+st.rejected+'</span></div>'+
      '<div class="kv"><span class="k">Overall</span><span class="v">'+statusPill(overall)+'</span></div>'+

      '<button class="btn primary" data-act="draft" '+(canDraft?"":"disabled")+actAttrs("draft")+'>'+icon("doc")+'Generate Corrected BL Draft</button>'+
      (canDraft?'':'<span class="muted small" style="margin-left:10px">Enable after approving at least one suggestion.</span>')+
      draftHtml+
    '</div></div>';

async function generateDraft(){
  try{
    const d = await api("/shipments/"+state.current.id+"/generate-corrected-draft",{method:"POST",body:"{}"});
    state.draft=d;
    renderDetail(); // re-render in place so the draft card persists
    toast("Corrected draft generated","ok");
  }catch(e){
    toast("Draft generation failed: "+e.message,"err");
  }
}

/* ---------- event delegation ---------- */
view.addEventListener("click", e=>{
  const th=e.target.closest("th[data-sort]");
  if(th){
    const k=th.dataset.sort;
    if(state.dashSort.key===k) state.dashSort.dir*=-1; else state.dashSort={key:k,dir:1};
    state.dashSel=0;
    paintDashboard();
    return;
  }
  const b=e.target.closest("[data-act]");
  if(!b) return;
  const act=b.dataset.act, id=+b.dataset.id;
  if(act==="compare"){ compareVersions(); return; }
  if(act==="swap"){ swapCompare(); return; }
  if(act==="draft"){ generateDraft(); return; }
  if(act==="refresh-dash"){ renderDashboard(); const u=document.getElementById("dashUpdated"); if(u) u.textContent="Updated "+fmtTime(new Date()); return; }
  if(act==="fver"||act==="fres"){
    const grp=act==="fver"?"ver":"res";
    state.dashFilter[grp]=b.dataset.val;
    paintDashboard();
    return;
  }
  if(act==="suggest"||act==="approve"||act==="reject"){
    const card=b.closest(".issue");
    const note=card?card.querySelector(".review-note"):null;
    const comment=note?note.value.trim():"";
    doAction(act,id,comment);
  }
});
view.addEventListener("change", e=>{

});

/* ---------- theme ---------- */
/* Shares the `sdoc-theme` key with the Review Console so both pages open in the
   same mode the user last picked, and stay in sync across tabs. */
function themeLabel(t){ return (t==="dark"?"Dark":"Light")+" mode"; }
function currentTheme(){ return document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light"; }
/* The toggle wears the CURRENT mode: a sun while you are in light mode, a moon
   while you are in dark mode. Same rule in the palette and the Review Console. */
function themeIconName(t){ return t==="light"?"sun":"moon"; }
/* Reuse the palette's SVG and strip its wrapper, so the toggle icon and the
   palette entry can never show different glyphs. */
function themeIconInner(t){
  return icon(themeIconName(t)).replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"");
}
function applyThemeChrome(t){
  const ico=document.getElementById("themeIcon");
  if(ico) ico.innerHTML=themeIconInner(t);
  const lbl=document.getElementById("themeLbl");
  if(lbl) lbl.textContent=themeLabel(t);
  const btn=document.getElementById("themeBtn");
  if(btn){
    const next=t==="dark"?"light":"dark";
    btn.dataset.tip="Switch to "+next+" mode";
    btn.dataset.tipDesc="Currently in "+t+" mode";
    btn.setAttribute("aria-label","Switch to "+next+" mode");
  }
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  applyThemeChrome(t);
  try{ localStorage.setItem("sdoc-theme",t); localStorage.removeItem("shipsync-theme"); }catch(_){}
}
function toggleTheme(){ setTheme(currentTheme()==="dark"?"light":"dark"); }
(function initTheme(){
  let t=currentTheme();
  try{
    const saved=localStorage.getItem("sdoc-theme")||localStorage.getItem("shipsync-theme");
    if(saved==="light"||saved==="dark") t=saved;
  }catch(_){}
  setTheme(t);
})();
document.getElementById("themeBtn").addEventListener("click",toggleTheme);
window.addEventListener("storage", e=>{
  if(e.key==="sdoc-theme" && (e.newValue==="light"||e.newValue==="dark")){
    document.documentElement.setAttribute("data-theme",e.newValue);
    applyThemeChrome(e.newValue);
  }
});

/* ---------- collapsible rail ---------- */
/* Also shares index.html's `sdoc-rail` key, so the rail stays collapsed/expanded
   as you move between the two consoles. */
const appEl=document.getElementById("app");
function setRail(v){
  appEl.classList.toggle("collapsed", !!v);
  const b=document.getElementById("collapseBtn");
  if(b){
    b.title=(v?"Expand":"Collapse")+" sidebar ( [ )";
    b.setAttribute("aria-label",(v?"Expand":"Collapse")+" sidebar");
    /* The hover bubble is derived from the same state as the button itself. */
    b.setAttribute("data-tip",(v?"Expand":"Collapse")+" sidebar");
    b.setAttribute("data-tip-desc", v
      ? "Bring the full sidebar back"
      : "Shrink the sidebar to an icon rail");
  }
  try{ localStorage.setItem("sdoc-rail", v?"1":"0"); }catch(_){}
}
let railAnimT=null;
function toggleRail(){
  /* Scoped to the transition window so the rail animates on a user collapse but
     not on every page load in rail mode. Mirrors index.html. */
  appEl.classList.add("rail-anim");
  setRail(!appEl.classList.contains("collapsed"));
  clearTimeout(railAnimT);
  railAnimT=setTimeout(()=>appEl.classList.remove("rail-anim"),480);
}

/* ---------- search palette (Ctrl+K) ---------- */
const palEl=document.getElementById("palette");
const palQ=document.getElementById("palQ");
const palList=document.getElementById("palList");
let palItems=[], palIdx=0;

function go(hash){
  if(location.hash===hash) route(); else location.hash=hash;
}
function shipItem(sh, recent){
  return {
    ico: recent?icon("clock"):icon("ship"),
    recent: !!recent,
    title: sh.shipment_key||("Shipment #"+sh.id),
    meta:"#"+sh.id+" · "+(fmtFile(sh.si_latest&&sh.si_latest.filename))+" → "+
      (fmtFile(sh.bl_latest&&sh.bl_latest.filename))+" · "+(sh.status||"VERIFIED")+
      (sh.mismatch_count>0?(" · "+sh.mismatch_count+" mismatch"+(sh.mismatch_count>1?"es":"")):" · OK"),
    run:()=>{ go("#/s/"+sh.id); }
  };
}
function palShipItems(q){
  const all=state.shipments||[];
  if(q){
    return all.filter(sh=>{
      const hay=[sh.shipment_key, sh.reference_number, "shipment "+sh.id, sh.status,
        sh.si_latest&&sh.si_latest.filename, sh.bl_latest&&sh.bl_latest.filename]
        .filter(Boolean).join(" ").toLowerCase();
      return hay.indexOf(q)>=0;
    }).slice(0,40).map(sh=>shipItem(sh,false));
  }
  /* Empty query: recently opened shipments float to the top, the rest fills up to 12. */
  const seen={}, out=[];
  recentShipIds().forEach(id=>{
    const sh=all.find(x=>x.id===id);
    if(sh && !seen[sh.id]){ seen[sh.id]=1; out.push(shipItem(sh,true)); }
  });
  for(const sh of all){
    if(out.length>=12) break;
    if(!seen[sh.id]){ seen[sh.id]=1; out.push(shipItem(sh,false)); }
  }
  return out;
}
/* Filters are searchable by name and by word, so "pending" or "needs review" finds
   the right dashboard view without knowing what the chip is called. */
function palFilterItems(q){
  return Object.keys(FILTER_LABEL).filter(k=>{
    const parts=k.split(":"), m=FILTER_LABEL[k], al=FILTER_ALIASES[k]||[];
    return ("filter "+m[0]+" "+parts[0]+" "+parts[1]+" "+al.join(" ")).toLowerCase().indexOf(q)>=0;
  }).map(k=>{
    const parts=k.split(":"), m=FILTER_LABEL[k], fk=FILTER_KEYS[parts[0]][parts[1]];
    return {
      ico:icon("filter"),
      title:"Filter · "+m[0],
      meta:"Show only these shipments on the dashboard",
      kbd:kbdOne(fk[0]),
      run:()=>{ setDashFilter(parts[0],parts[1]); }
    };
  });
}
/* The pinned row: your three most-used filters, with a usage count and their key. */
function palPins(){
  return topFilters(3).map(p=>{
    const parts=p.key.split(":"), m=FILTER_LABEL[p.key];
    const fk=FILTER_KEYS[parts[0]]&&FILTER_KEYS[parts[0]][parts[1]];
    return { dot:m[1], label:m[0], count:p.count, kbd:fk?kbdOne(fk[0]):"",
      run:()=>{ setDashFilter(parts[0],parts[1]); } };
  });
}
function palCmds(){
  const c=[
    {ico:icon("home"), title:"Shipment Dashboard", meta:"Back to the shipment list", kbd:"G", run:goDashboard},
    {ico:icon("refresh"), title:"Reload current view", meta:"Re-fetch data from the API", run:()=>{ route(); }},
    {ico:icon(themeIconName(currentTheme())), title:"Switch theme",
      meta:"Currently "+currentTheme()+" — switch to "+(currentTheme()==="dark"?"light":"dark"),
      kbd:"T", run:toggleTheme},
    {ico:icon("rail"), title:"Toggle sidebar", meta:"Expand / collapse the rail", kbd:"[", run:toggleRail},
    {ico:icon("bolt"), title:"Keyboard shortcuts", meta:"Every shortcut in one place", kbd:"?", run:openHelp},
    {ico:icon("mail"), title:"Open Review Console", meta:"Email-centric console at /ui/", kbd:"1", run:()=>{ navTo(NAV.console.href); }}
  ];
  if(state.current){
    c.unshift({ico:icon("compare"), title:"Compare versions",
      meta:"Shipment "+(state.current.shipment_key||("#"+state.current.id)),
      run:()=>{ compareVersions(); }});
  }
  return c;
}
function palRender(){
  const q=palQ.value.trim().toLowerCase();
  /* Pinned filters sit above everything — same section, order and look as the Review
     Console palette, so the two searches read as one product. */
  const pins = q ? [] : palPins();
  /* Group order mirrors the Review Console palette: pins, then what you touched
     last, then commands, then results — so recents never hide below the fold. */
  const groups=[];
  const found=palShipItems(q);
  if(!q){
    const rec=found.filter(x=>x.recent);
    if(rec.length) groups.push({label:"Recent", items:rec});
  }
  const cmds=palCmds().filter(x=> !q || (x.title+" "+x.meta).toLowerCase().indexOf(q)>=0);
  if(cmds.length) groups.push({label:"Actions", items:cmds});
  if(q){
    const fl=palFilterItems(q);
    if(fl.length) groups.push({label:"Filters", items:fl});
    if(found.length) groups.push({label:"Shipments", items:found});
  }else{
    const rest=found.filter(x=>!x.recent);
    if(rest.length) groups.push({label:"Shipments", items:rest});
  }
  /* Pins are keyboard-reachable too, so they are part of palItems even though they
     render as chips rather than rows. */
  palItems=pins.reduce((a,p)=>a.concat([p]), groups.reduce((a,g)=>a.concat(g.items), []));
  if(palIdx>palItems.length-1) palIdx=palItems.length-1;
  if(palIdx<0) palIdx=0;
  if(!palItems.length){
    const none=!(state.shipments&&state.shipments.length);
    palList.innerHTML='<div class="pal-empty">'+(none
      ? 'No shipments loaded yet.<br>Process inbox emails in the Review Console to create them.'
      : 'No shipment, filter or action matches \u201C'+esc(palQ.value)+'\u201D<br>Try a shipment key, a reference number, a filename, or a filter like pending.')+'</div>';
    return;
  }
  let html="", i=-1;
  if(pins.length){
    html+='<div class="pal-group">Your frequent filters</div><div class="pal-pins">';
    for(const p of pins){
      i++;
      html+='<button type="button" class="pal-pin'+(i===palIdx?" active":"")+'" data-i="'+i+'">'+
        '<span class="dot" style="background:'+p.dot+'"></span>'+esc(p.label)+
        '<span class="pal-pin-c">'+p.count+'</span>'+
        (p.kbd?'<span class="pal-pin-k">'+esc(p.kbd)+'</span>':'')+
        '</button>';
    }
    html+='</div>';
  }else if(!q){
    html+='<div class="pal-group">Your frequent filters</div>'+
      '<div class="pal-hint">Filter the dashboard by verification or resolution — <b>the ones you use most get pinned here</b>. Or type <b>needs review</b>, <b>pending</b> or <b>unresolved</b>.</div>';
  }
  for(const g of groups){
    html+='<div class="pal-group">'+g.label+'</div>';
    for(const it of g.items){
      i++;
      html+='<div class="palette-item'+(i===palIdx?" active":"")+'" data-i="'+i+'">'+
        '<div class="pi-ico">'+it.ico+'</div>'+
        '<div class="pi-txt"><b>'+esc(it.title)+'</b><span>'+esc(it.meta)+'</span></div>'+
        (it.kbd?'<span class="pi-kbd">'+esc(it.kbd)+'</span>':'')+'</div>';
    }
  }
  palList.innerHTML=html;
  palScroll();
}
function palScroll(){
  const act=palList.querySelector("[data-i].active");
  if(act&&act.scrollIntoView) act.scrollIntoView({block:"nearest"});
}
function palMove(d){
  if(!palItems.length) return;
  palIdx=(palIdx+d+palItems.length)%palItems.length;
  palList.querySelectorAll("[data-i]").forEach(el=>{ el.classList.toggle("active", +el.dataset.i===palIdx); });
  palScroll();
}
function palRun(){
  const it=palItems[palIdx];
  if(!it) return;
  palClose();
  it.run();
}
function palOpen(){
  palEl.hidden=false;
  palQ.value=""; palIdx=0;
  palRender();
  palQ.focus();
  if(!(state.shipments&&state.shipments.length)){
    api("/shipments").then(d=>{
      state.shipments=d.shipments||[];
      if(!palEl.hidden) palRender();
    }).catch(()=>{});
  }
}
/* Closing must also drop focus: the input lives inside a hidden container, and a
   focused-but-hidden field would make isTyping() swallow every later shortcut. */
function palClose(){
  palEl.hidden=true;
  const a=document.activeElement;
  if(a && palEl.contains(a) && a.blur) a.blur();
}

palQ.addEventListener("input",()=>{ palIdx=0; palRender(); });
palList.addEventListener("click",e=>{
  const el=e.target.closest(".palette-item,.pal-pin");
  if(!el) return;
  palIdx=+el.dataset.i; palRun();
});
palList.addEventListener("mousemove",e=>{
  const el=e.target.closest(".palette-item,.pal-pin");
  if(!el||+el.dataset.i===palIdx) return;
  palIdx=+el.dataset.i;
  palList.querySelectorAll("[data-i]").forEach(x=>x.classList.toggle("active", x===el));
});
