<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShipMail · ShipSync</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232dd4bf'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 17l4 4 9-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
/* Match the Dashboard theme so ShipMail and the Operations Console feel like
   one product. Shared key `sdoc-theme` is also used by /ui/. */
(function(){try{var t=localStorage.getItem("sdoc-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(_){}})();
</script>
<style>
:root{
  --bg:#080d18; --bg-2:#0b1222;
  --surface:rgba(255,255,255,.036); --surface-2:#0f1829; --surface-3:#152036;
  --surface-hover:rgba(45,212,191,.07);
  --border:rgba(148,163,184,.17); --border-strong:rgba(148,163,184,.30);
  --text:#f2f6ff; --muted:#a3b2c9; --muted-2:#7f8ea8;
  --accent:#2dd4bf; --accent-2:#38bdf8; --accent-3:#6366f1;
  --grad:linear-gradient(135deg,#2dd4bf 0%,#38bdf8 52%,#6366f1 100%);
  --grad-btn:linear-gradient(135deg,#0f766e 0%,#0e7490 50%,#4338ca 100%);
  --ok:#34d399; --ok-bg:rgba(52,211,153,.12); --ok-bd:rgba(52,211,153,.38);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12); --warn-bd:rgba(251,191,36,.40);
  --bad:#fb7185; --bad-bg:rgba(251,113,133,.12); --bad-bd:rgba(251,113,133,.40);
  --cat-SI:#7dd3fc; --cat-BL:#a78bfa; --cat-INVOICE:#f472b6;
  --shadow:0 18px 50px -20px rgba(0,0,0,.65);
  --radius:14px;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
[data-theme="light"]{
  --bg:#eef2f8; --bg-2:#e6ecf5;
  --surface:rgba(255,255,255,.72); --surface-2:#ffffff; --surface-3:#f5f8fc;
  --surface-hover:rgba(13,148,136,.07);
  --border:rgba(15,23,42,.10); --border-strong:rgba(15,23,42,.18);
  --text:#0f1b2d; --muted:#54657f; --muted-2:#8696ad;
  --accent:#0d9488; --accent-2:#0284c7; --accent-3:#4f46e5;
  --grad:linear-gradient(135deg,#0d9488 0%,#0284c7 52%,#4f46e5 100%);
  --grad-btn:linear-gradient(135deg,#0f766e 0%,#0e7490 50%,#4338ca 100%);
  --ok:#059669; --ok-bg:rgba(5,150,105,.10); --ok-bd:rgba(5,150,105,.34);
  --warn:#d97706; --warn-bg:rgba(217,119,6,.10); --warn-bd:rgba(217,119,6,.36);
  --bad:#e11d48; --bad-bg:rgba(225,29,72,.09); --bad-bd:rgba(225,29,72,.34);
  --cat-SI:#0284c7; --cat-BL:#7c3aed; --cat-INVOICE:#db2777;
  --shadow:0 18px 45px -22px rgba(15,23,42,.30);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;
  -webkit-font-smoothing:antialiased;letter-spacing:.1px}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 600px at 10% -5%,rgba(45,212,191,.10),transparent 60%),
    radial-gradient(1000px 700px at 100% 0%,rgba(99,102,241,.10),transparent 55%),
    radial-gradient(800px 600px at 85% 110%,rgba(56,189,248,.06),transparent 60%)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- top bar ---------------- */
.top{position:relative;z-index:2;height:60px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:color-mix(in srgb,var(--surface-2) 80%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;user-select:none}
.mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.logo b{font-size:18px;font-weight:800;letter-spacing:-.2px}
.logo .tag{font-size:10px;font-weight:700;color:var(--muted-2);border:1px solid var(--border);
  border-radius:999px;padding:2px 7px;margin-left:2px}
.search{flex:1;max-width:680px;margin:0 8px;height:42px;display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:0 14px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;color:var(--text);font-size:14px}
.search input::placeholder{color:var(--muted-2)}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
  border:1px solid var(--border);border-radius:999px;padding:6px 12px;background:var(--surface);white-space:nowrap}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2)}
.conn.live .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.conn.need .dot{background:var(--warn)}
.ss-launch{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);
  border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;color:var(--text);transition:.15s}
.ss-launch:hover{border-color:var(--accent);background:var(--surface-hover);box-shadow:0 1px 6px rgba(56,189,248,.28)}
.ss-launch.active{border-color:var(--accent);background:var(--surface-hover)}
.ss-launch .mark{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
.ss-launch span:last-child{font-size:13px;font-weight:650}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.18s}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--surface-hover)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:13px;margin-left:4px}

/* ---------------- layout ---------------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(300px,400px) minmax(360px,1fr) 400px;
  height:calc(100vh - 60px);transition:grid-template-columns .18s ease}
body.side-closed .app{grid-template-columns:236px minmax(300px,400px) minmax(360px,1fr) 0}

/* left rail */
.left{background:linear-gradient(180deg,var(--surface-2),var(--bg-2));border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;padding:14px 12px;gap:6px}
.compose{margin:2px 4px 12px;border:0;border-radius:14px;background:var(--grad-btn);color:#fff;
  height:46px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
  justify-content:center;box-shadow:var(--shadow);transition:.18s}
.compose:hover{filter:brightness(1.08)}
.compose svg{width:18px;height:18px}
.folders{display:flex;flex-direction:column;gap:2px}
.folder{display:flex;align-items:center;gap:12px;padding:0 12px;height:36px;border-radius:0 12px 12px 0;
  color:var(--muted);cursor:pointer;user-select:none;font-weight:500;transition:.15s}
.folder svg{width:17px;height:17px;opacity:.85}
.folder:hover{background:var(--surface);color:var(--text)}
.folder.active{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text);font-weight:700}
.folder .n{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted-2);
  background:var(--surface-3);border-radius:999px;padding:1px 9px}
.sect{padding:14px 14px 6px;font-size:11px;font-weight:700;color:var(--muted-2);letter-spacing:.6px;text-transform:uppercase}
.lab{display:flex;align-items:center;gap:11px;padding:0 14px;height:30px;color:var(--muted);font-size:13px;cursor:default}
.lab .dot{width:9px;height:9px;border-radius:50%}
.conn-card{margin-top:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:12px;
  display:flex;flex-direction:column;gap:9px}
.conn-card h5{margin:0;font-size:11px;font-weight:700;color:var(--muted-2);letter-spacing:.5px;text-transform:uppercase}
.conn-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.conn-row .dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:0 0 8px}
.conn-row.live .dot{background:var(--ok)}
.conn-row.need .dot{background:var(--warn)}
.mini{font-size:11.5px;font-weight:650;border-radius:8px;padding:6px 10px;cursor:pointer;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);transition:.15s}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.primary{background:var(--grad-btn);border:0;color:#fff}
.mini:disabled{opacity:.5;cursor:not-allowed}

/* ---------------- list ---------------- */
.list{background:var(--surface-2);border-right:1px solid var(--border);overflow:auto;display:flex;flex-direction:column}
.listbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface-2);z-index:2;color:var(--muted);font-weight:600}
.listbar .grow{flex:1}
.src-toggle{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.src-toggle button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;
  padding:5px 11px;cursor:pointer;transition:.15s}
.src-toggle button+button{border-left:1px solid var(--border)}
.src-toggle button.on{background:var(--grad-btn);color:#fff}
.src-toggle button:hover:not(.on){color:var(--text)}
.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start;
  position:relative;transition:background .12s}
.row:hover{background:var(--surface)}
.row.active{background:var(--surface-hover)}
.row.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad)}
.row .av{width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:13px}
.row .mid{flex:1;min-width:0}
.row .r1{display:flex;align-items:center;gap:8px}
.row .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.row.unread .who{font-weight:800}
.row .tag{font-size:10px;font-weight:700;border-radius:5px;padding:1px 7px;letter-spacing:.3px}
.row .tag.SI{background:color-mix(in srgb,var(--cat-SI) 18%,transparent);color:var(--cat-SI)}
.row .tag.BL{background:color-mix(in srgb,var(--cat-BL) 18%,transparent);color:var(--cat-BL)}
.row .tag.INVOICE{background:color-mix(in srgb,var(--cat-INVOICE) 18%,transparent);color:var(--cat-INVOICE)}
.row .tag.DOC{background:var(--surface-3);color:var(--muted)}
.row .subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;color:var(--text);font-size:13.5px}
.row.unread .subj{font-weight:700}
.row .snip{color:var(--muted-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .tm{font-size:11.5px;color:var(--muted-2);white-space:nowrap}
.row .clip{margin-left:5px}

/* ---------------- mail ---------------- */
.mail{background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.mailbar{display:flex;align-items:center;gap:4px;height:52px;padding:0 18px;border-bottom:1px solid var(--border);color:var(--muted)}
.mailbar .ic{width:32px;height:32px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;
  display:grid;place-items:center;transition:.15s}
.mailbar .ic:hover{background:var(--surface);color:var(--text)}
.mailbar .grow{flex:1}
.chip{font-size:11.5px;font-weight:650;border:1px solid var(--border);border-radius:999px;padding:4px 11px;color:var(--muted)}
.wrap{padding:26px 36px 44px;max-width:900px}
.subj{font-size:23px;font-weight:600;line-height:1.32;margin-bottom:20px;letter-spacing:-.2px}
.msg{display:flex;gap:14px;align-items:flex-start}
.msg .av{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.msg .who{flex:1;min-width:0}
.msg .who b{font-weight:700;font-size:14.5px}
.msg .who .to{color:var(--muted-2);font-size:12.5px}
.msg .when{color:var(--muted-2);font-size:12px;white-space:nowrap}
.body{margin-top:20px;line-height:1.7;white-space:pre-wrap;color:var(--text);font-size:14.5px}
.atts{margin-top:28px;border-top:1px solid var(--border);padding-top:18px}
.atts .hd{font-size:12.5px;color:var(--muted);margin-bottom:12px;font-weight:600}
.attrow{display:flex;gap:12px;flex-wrap:wrap}
.att{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface);min-width:230px;cursor:pointer;
  display:flex;gap:11px;align-items:center;transition:.15s}
.att:hover{border-color:var(--accent);background:var(--surface-hover);transform:translateY(-1px)}
.att .ic{width:34px;height:34px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;color:var(--accent);flex:0 0 34px}
.att .nm{font-weight:650;font-size:13px;word-break:break-all}
.att .mt{font-size:11.5px;color:var(--muted-2);margin-top:3px}
.preview{margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);overflow:hidden}
.preview .ph{padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);background:var(--surface)}
.preview pre{margin:0;padding:14px;font-family:var(--mono);font-size:11.5px;line-height:1.6;max-height:280px;overflow:auto;white-space:pre-wrap;color:var(--text)}

/* ---------------- ship panel ---------------- */
/* The panel keeps its own always-dark palette. The page theme (shared with
   the Dashboard via sdoc-theme) flips --text to near-black in light mode,
   which used to render dark text on this hardcoded dark background —
   unreadable. Re-declaring the variables here overrides them for the panel
   and everything inside it, in both themes. */
.side{--text:#eef4ff;--muted:#b9c7dd;--muted-2:#94a4bf;
  background:linear-gradient(180deg,#0b1222,#0a0f1c);color:var(--text);border-left:1px solid #1b2740;
  overflow:auto;display:flex;flex-direction:column}
body.side-closed .side{visibility:hidden;border-left:0;overflow:hidden}
.shead{padding:16px 18px;border-bottom:1px solid #1b2740;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;background:linear-gradient(180deg,#0b1222,#0a0f1c);z-index:2}
.smark{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#06202a}
.shead b{font-size:15px;letter-spacing:.3px}
.shead span{display:block;font-size:11px;color:var(--muted-2);margin-top:2px}
.panel{padding:15px 18px;border-bottom:1px solid #1b2740}
.panel h3{margin:0 0 11px;color:var(--muted-2);font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700}
.ship{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ship .id{font-size:19px;font-weight:750;letter-spacing:.5px}
.pill{border-radius:999px;padding:4px 10px;font-weight:700;font-size:11.5px;white-space:nowrap}
.pill.ok{background:rgba(52,211,153,.18);color:#6ee7a8}
.pill.warn{background:rgba(251,191,36,.18);color:#fbbf24}
.pill.bad{background:rgba(251,113,133,.18);color:#fb7185}
.pill.mute{background:rgba(148,163,184,.20);color:#e2e8f4}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;font-size:12.5px;margin-top:12px}
.kv span:nth-child(odd){color:var(--muted-2)}
.kv b{font-weight:650;word-break:break-word;color:var(--text)}
.doc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(148,163,184,.10)}
.doc:last-child{border-bottom:0}
.doc .l b{font-size:13px}
.doc .l small{color:var(--muted-2);font-size:11px;display:block;margin-top:2px;word-break:break-all}
.doc .r{font-size:12px;font-weight:700;white-space:nowrap}
.good{color:#6ee7a8}.bad-tx{color:#fb7185}.miss{color:#fbbf24}.poss{color:#fbbf24;font-weight:600}.dim{color:#94a3b8}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:7px 0;border-bottom:1px solid rgba(148,163,184,.10);vertical-align:top}
td:first-child{color:var(--muted-2);width:46%}
td.val{color:#e2e8f4;font-family:var(--mono);font-size:11.5px}
.note{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.26);border-radius:9px;padding:10px 12px;
  font-size:12.5px;color:#fde68a;margin-bottom:10px}
.note.bad{background:rgba(251,113,133,.10);border-color:rgba(251,113,133,.28);color:#fda4af}
.btns{display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid #26344f;background:#16223a;color:var(--text);border-radius:9px;padding:10px 12px;cursor:pointer;
  font-weight:650;font-size:13px;width:100%;transition:.15s}
.btn:hover{border-color:var(--accent-2)}
.btn.primary{background:var(--grad-btn);border:0;color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.src{font-size:11px;color:var(--muted-2);margin-top:10px;line-height:1.5}
.src b{color:#e2e8f4;font-weight:650}
.empty{padding:26px 18px;color:var(--muted-2);font-size:13px;line-height:1.6}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent-2);border-top-color:transparent;
  display:inline-block;vertical-align:-2px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0b1222;color:#fff;border:1px solid var(--border);
  padding:10px 18px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1}
@media(max-width:1280px){.app{grid-template-columns:208px minmax(280px,360px) 1fr 340px}}
@media(max-width:1040px){.app{grid-template-columns:200px 1fr 330px}.left{display:none}.side{position:fixed;right:0;top:60px;bottom:0;box-shadow:-12px 0 30px rgba(0,0,0,.25)}}
@media(max-width:820px){.app{grid-template-columns:1fr}.list,.side{display:none}}
</style>
</head>
<body class="side-closed">

<div class="top">
  <div class="logo">
    <div class="mark">S</div>
    <b>ShipMail</b>
    <span class="tag">demo</span>
  </div>
  <div class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="Search mail" aria-label="Search mail">
  </div>
  <div class="conn" id="connChip" title="Mail source status"><span class="dot"></span><span id="connTxt">Simulated</span></div>
  <div class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </div>
  <button class="ss-launch" id="ssLaunch" type="button" title="Toggle ShipSync panel · double-click opens Dashboard">
    <span class="mark" style="width:26px;height:26px;font-size:12px">S</span>
    <span>ShipSync</span>
  </button>
  <div class="avatar">O</div>
</div>

<div class="app">
  <aside class="left">
    <button class="compose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Compose</button>
    <div class="folders">
      <div class="folder active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>Inbox <span class="n" id="cInbox">0</span></div>
      <div class="folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 16.5 7.1 18l.9-5.5-4-3.9 5.5-.8z"/></svg>Starred</div>
      <div class="folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3 2 12l8 3 3 8 9-20z"/></svg>Sent</div>
      <div class="folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 13h7M9 17h5"/></svg>Drafts</div>
      <div class="folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>All Mail</div>
    </div>
    <div class="sect">Labels</div>
    <div class="folders">
      <div class="lab"><span class="dot" style="background:#38bdf8"></span>Shipping</div>
      <div class="lab"><span class="dot" style="background:#34d399"></span>Finance</div>
      <div class="lab"><span class="dot" style="background:#fbbf24"></span>Needs action</div>
    </div>

    <div class="conn-card">
      <h5>Mail source</h5>
      <div class="conn-row" id="simRow"><span class="dot"></span><span>Simulated inbox</span></div>
      <div class="conn-row" id="gmailRow"><span class="dot"></span><span>Real Gmail</span></div>
      <button class="mini primary" id="gmailConnect" style="display:none" onclick="connectGmail()">Connect Gmail</button>
      <button class="mini" id="gmailSync" style="display:none" onclick="syncGmail()">Sync now</button>
      <div id="gmailNote" style="font-size:11px;color:var(--muted-2);line-height:1.5"></div>
    </div>
  </aside>

  <section class="list" id="list">
    <div class="listbar"><span>Inbox</span><span class="grow"></span>
      <div class="src-toggle" id="srcToggle">
        <button data-src="simulated" class="on" onclick="switchSource('simulated')">Simulated</button>
        <button data-src="real" onclick="switchSource('real')">Real Gmail</button>
      </div>
      <span id="listMeta"></span></div>
    <div id="rows"></div>
  </section>

  <main class="mail" id="mail"></main>

  <aside class="side" id="side"></aside>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   ShipMail — simulated mail client for ShipSync.

   Traffic rules (same as before the rename):
     * Opening the inbox reads LOCAL static JSON only. Zero backend calls.
     * Selecting an email renders from memory, or reads a STORED result
       (GET /api/results/{id}). Reading never triggers processing.
     * Processing happens ONLY on an explicit "Run ShipSync" / "Re-process".
     * No setInterval, no polling, no background refresh anywhere.
   Attachment previews are fetched on click from GET /api/attachments/{path},
   which resolves the bundle-relative path against the active DATA_SOURCE.
   ========================================================================= */
const API = "";                       // same origin as the ShipSync backend
const DATA = "data/";                 // static demo data, served as files
let EMAILS = [], SHIPMENTS = {}, active = 0;
let mailSource = "simulated";         // "simulated" | "real"
let REAL = [];                        // normalized real Gmail messages
const results = Object.create(null);
const attText = Object.create(null);
let shipSyncClickTimer = null;

// The list currently shown depends on the selected mail source.
function curList(){ return mailSource === "simulated" ? EMAILS : REAL; }

const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color = s => { let h = 0; for (const ch of (s||"")) h = (h*31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 55% 42%)`; };
const initials = n => (n||"?").split(/[\s.@]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const FIELD_LABELS = {
  port_of_loading:"Port of Loading", port_of_discharge:"Port of Discharge",
  container_count:"Container Count", gross_weight_kg:"Gross Weight",
  shipper:"Shipper", consignee:"Consignee", notify_party:"Notify Party",
  etd:"ETD (Departure)", eta:"ETA (Arrival)",
};
const label = k => FIELD_LABELS[k] || k.replace(/_kg/,"").replace(/_/g," ").replace(/\b\w/g, c => c.toUpperCase());

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 2600);
}
function isPanelOpen(){ return !document.body.classList.contains("side-closed"); }
function setPanelOpen(open){
  document.body.classList.toggle("side-closed", !open);
  $("ssLaunch")?.classList.toggle("active", open);
  if (open && curList()[active]){
    if (results[curList()[active].id]) renderSide(results[curList()[active].id]);
    else renderIdle();
  }
}
function toggleShipSyncPanel(){ setPanelOpen(!isPanelOpen()); }

/* ------------------------------------------------------------------ boot */
async function boot(){
  const [emails, ships] = await Promise.all([
    fetch(DATA + "emails.json").then(r => r.json()).catch(() => ({emails: []})),
    fetch(DATA + "shipments.json").then(r => r.json()).catch(() => ({shipments: []})),
  ]);
  EMAILS = emails.emails || [];
  SHIPMENTS = Object.fromEntries((ships.shipments || []).map(s => [s.shipment_id, s]));
  $("cInbox").textContent = EMAILS.length;
  $("listMeta").textContent = EMAILS.length + " conversations";
  renderList();
  if (EMAILS.length) openMail(0);
  refreshGmailStatus();
}

/* ----------------------------------------------------- real Gmail status */
async function refreshGmailStatus(){
  try{
    const st = await (await fetch(API + "/api/gmail/status")).json();
    const sim = $("simRow"), g = $("gmailRow"), chip = $("connChip"), txt = $("connTxt"), note = $("gmailNote");
    sim.className = "conn-row"; sim.querySelector(".dot").style.background = "var(--accent)";
    const gmailOn = st.token_configured && st.oauth_libraries_available;
    g.className = "conn-row" + (gmailOn ? " live" : (st.credentials_configured ? " need" : ""));
    if (gmailOn){
      g.querySelector(".dot").style.background = "var(--ok)";
      chip.className = "conn live"; txt.textContent = "Gmail connected";
      $("gmailSync").style.display = ""; $("gmailConnect").style.display = "none";
      note.textContent = "Real Gmail is linked — use Sync now to pull new mail.";
    } else if (st.credentials_configured){
      g.querySelector(".dot").style.background = "var(--warn)";
      chip.className = "conn need"; txt.textContent = "Gmail setup needed";
      $("gmailConnect").style.display = ""; $("gmailSync").style.display = "none";
      note.textContent = "OAuth client configured — finish the connection.";
    } else {
      g.querySelector(".dot").style.background = "var(--muted-2)";
      chip.className = "conn"; txt.textContent = "Simulated";
      $("gmailConnect").style.display = ""; $("gmailSync").style.display = "none";
      note.textContent = "Add a Google OAuth client to enable real Gmail.";
    }
    if (mailSource === "real"){ chip.className = "conn"; txt.textContent = "Real Gmail"; }
  }catch(_){ /* status is best-effort */ }
}
async function connectGmail(){
  try{
    const r = await fetch(API + "/api/gmail/connect");
    if (!r.ok){ toast("Gmail not configured on the server."); return; }
    const { authorization_url } = await r.json();
    // Full-page navigation, not a small popup: Google's consent screen is
    // unreliable in a 480x640 window (it can render an error page instead of
    // the account chooser). The callback sends the operator back to ShipMail.
    window.location.href = authorization_url;
  }catch(_){ toast("Could not start Gmail connection."); }
}
async function syncGmail(){
  toast("Syncing Gmail…");
  try{
    // force=true re-runs already synced messages through the pipeline —
    // the same explicit-reprocess contract as /api/process force:true.
    const r = await fetch(API + "/api/gmail/poll?force=true", {method:"POST"});
    const d = await r.json();
    toast(`Gmail sync: ${d.processed} processed, ${d.skipped} skipped.`);
    if (mailSource === "real") await loadReal();   // refresh the real inbox
  }catch(_){ toast("Gmail sync failed."); }
}

/* ----------------------------------------------- real Gmail mail source */
// Normalize a /api/gmail/messages item into the same shape renderList /
// renderMail expect, so Simulated and Real share one rendering path.
function normalizeReal(m){
  const sender = m.sender || "Unknown sender";
  const m0 = sender.match(/^(.*?)\s*<([^>]+)>/);
  const fromName = m0 ? (m0[1].trim() || m0[2]) : sender;
  const fromAddr = m0 ? m0[2] : sender;
  const atts = (m.attachments || []).map(f => ({
    filename: f,
    kind: "GMAIL",
    size_kb: 0,
    path: "gmail/attachment/" + encodeURIComponent(m.email_id) + "/" + encodeURIComponent(f),
  }));
  return {
    id: m.email_id,
    email_id: m.email_id,
    message_id: m.gmail_message_id,
    thread_id: m.thread_id,
    from_name: fromName,
    from: fromAddr,
    to: "(you)",
    subject: m.subject || "(no subject)",
    snippet: (m.snippet || "").slice(0, 140),
    body: m.body || "",
    shipment_id: m.shipment_id || "",
    unread: m.processing_status !== "PROCESSED",
    received: m.processed_at ? new Date(m.processed_at).toLocaleString() : "",
    attachments: atts,
    _real: true,
    _status: m.status, _category: m.category, _has_defect: m.has_defect,
  };
}
async function switchSource(src){
  if (src === mailSource) return;
  mailSource = src;
  document.querySelectorAll("#srcToggle button").forEach(b =>
    b.classList.toggle("on", b.dataset.src === src));
  const chip = $("connChip"), txt = $("connTxt");
  if (src === "real"){
    chip.className = "conn"; txt.textContent = "Real Gmail";
    await loadReal();
  } else {
    chip.className = "conn"; txt.textContent = "Simulated";
    active = 0;
    renderList();
    if (EMAILS.length) openMail(0); else $("mail").innerHTML = "";
  }
}
async function loadReal(){
  $("listMeta").textContent = "loading…";
  try{
    const d = await (await fetch(API + "/api/gmail/messages")).json();
    REAL = (d.items || []).map(normalizeReal);
    $("listMeta").textContent = REAL.length + " message(s)";
    renderList();
    if (REAL.length) openMail(0);
    else $("mail").innerHTML = `<div class="empty" style="padding:42px 26px">
      No real Gmail mail yet.<br><br>Connect Gmail from the <b>Mail source</b> card on the
      left, then press <b>Sync now</b> to pull messages from your inbox here.</div>`;
  }catch(e){
    $("listMeta").textContent = "error";
    $("mail").innerHTML = `<div class="empty" style="padding:42px 26px">
      Could not load real Gmail messages.<br><br>${esc(e.message)}</div>`;
  }
}

/* ----------------------------------------------------------------- list */
function renderList(){
  const q = ($("q").value || "").toLowerCase();
  const shown = curList().filter(e =>
    !q || (e.subject + " " + e.from_name + " " + e.snippet + " " + e.shipment_id).toLowerCase().includes(q));
  $("rows").innerHTML = shown.map(e => {
    const i = curList().indexOf(e);
    const kinds = [...new Set(e.attachments.map(a => a.kind))];
    return `<div class="row ${i===active?"active":""} ${e.unread?"unread":""}" onclick="openMail(${i})">
      <div class="av" style="background:${color(e.from_name)}">${esc(initials(e.from_name))}</div>
      <div class="mid">
        <div class="r1"><span class="who">${esc(e.from_name)}</span>
          ${kinds.map(k=>`<span class="tag ${esc(k)}">${esc(k)}</span>`).join("")}</div>
        <div class="subj">${esc(e.subject)}</div>
        <div class="snip">${esc(e.snippet)}</div>
      </div>
      <div><div class="tm">${esc(e.received)}</div>
        ${e.attachments.length?`<div class="clip" title="${e.attachments.length} attachment(s)">&#128206; ${e.attachments.length}</div>`:""}
      </div></div>`;
  }).join("") || `<div class="empty">${mailSource === "real"
    ? "No real Gmail messages yet — connect Gmail, then press <b>Sync now</b>."
    : "No conversations match."}</div>`;
}

/* ----------------------------------------------------------------- mail */
function renderMail(){
  const e = curList()[active];
  const ship = SHIPMENTS[e.shipment_id] || {};
  $("mail").innerHTML = `
    <div class="mailbar">
      <button class="ic" title="Archive">&#8592;</button>
      <button class="ic" title="Report spam">&#9873;</button>
      <button class="ic" title="Delete">&#128465;</button>
      <span class="grow"></span>
      ${e.shipment_id?`<span class="chip">${esc(e.shipment_id)}</span>`:""}
      ${e._real && e._status?`<span class="chip">ShipSync: ${esc(e._status)}</span>`:""}
      <span class="chip">${esc(ship.status || (e._real ? "REAL GMAIL" : "INBOX"))}</span>
    </div>
    <div class="wrap">
      <div class="subj">${esc(e.subject)}</div>
      <div class="msg">
        <div class="av" style="background:${color(e.from_name)}">${esc(initials(e.from_name))}</div>
        <div class="who"><b>${esc(e.from_name)}</b> <span style="color:var(--muted-2)">&lt;${esc(e.from)}&gt;</span>
          <div class="to">to ${esc(e.to)}</div></div>
        <div class="when">${esc(e.received)}</div>
      </div>
      <div class="body">${esc(e.body)}</div>
      <div class="atts">
        <div class="hd">${e.attachments.length} attachment(s)</div>
        <div class="attrow">
          ${e.attachments.map((a,i)=>`<div class="att" onclick="previewAtt(${i})">
            <div class="ic">&#128196;</div>
            <div><div class="nm">${esc(a.filename)}</div><div class="mt">${esc(a.kind)} · ${a.size_kb} KB</div></div></div>`).join("")
            || `<span style="color:var(--muted-2);font-size:13px">No attachments</span>`}
        </div>
        <div id="preview"></div>
      </div>
    </div>`;
}

async function previewAtt(i){
  const a = curList()[active].attachments[i];
  const key = a.path || a.filename;     // "gmail/..." → /api/gmail/... ; else bundle → /api/attachments/...
  const url = key.startsWith("gmail/") ? API + "/api/" + key : API + "/api/attachments/" + key;
  if (attText[key] === undefined){
    attText[key] = await fetch(url)
      .then(r => r.ok ? r.text() : "(could not read attachment)")
      .catch(() => "(could not read attachment)");
  }
  $("preview").innerHTML = `<div class="preview"><div class="ph">${esc(a.filename)}</div>
    <pre>${esc(attText[key])}</pre></div>`;
}

/* ------------------------------------------------------- open email flow */
async function openMail(i){
  active = i;
  const e = curList()[i];
  if (e.unread){ e.unread = false; }
  renderList(); renderMail();

  if (results[e.id]){ renderSide(results[e.id]); return; }
  showLoading("Reading stored ShipSync result…");
  try{
    const r = await fetch(`${API}/api/results/${encodeURIComponent(e.id)}`);
    if (r.ok){ results[e.id] = await r.json(); renderSide(results[e.id]); return; }
    if (r.status !== 404) throw new Error("HTTP " + r.status);
  }catch(err){ /* fall through to the not-processed state */ }
  renderIdle();
}

async function attachmentsFor(e){
  const out = [];
  for (const a of e.attachments){
    const key = a.path || a.filename;
    const url = key.startsWith("gmail/") ? API + "/api/" + key : API + "/api/attachments/" + key;
    if (attText[key] === undefined){
      attText[key] = await fetch(url).then(r => r.ok ? r.text() : "").catch(() => "");
    }
    out.push({filename: a.filename, content_text: attText[key]});
  }
  return out;
}

async function runShipSync(force){
  const e = curList()[active];
  setPanelOpen(true);
  showLoading(force ? "Re-processing with ShipSync…" : "ShipSync is processing this email…");
  try{
    const res = await fetch(API + "/api/process", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        email_id: e.id, message_id: e.message_id, thread_id: e.thread_id,
        shipment_id: e.shipment_id, from: e.from, subject: e.subject,
        body: e.body, attachments: await attachmentsFor(e),
        source: "shipmail", force: !!force,
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    results[e.id] = data;
    renderSide(data);
    toast(data.cached ? "Reused stored result — nothing re-processed." : "ShipSync processed this email.");
  }catch(err){
    $("side").innerHTML = sideHead() +
      `<div class="empty">Could not reach the ShipSync API (${esc(err.message)}).<br><br>
       <button class="btn" onclick="runShipSync(false)">Try again</button></div>`;
  }
}

async function requestDoc(doc){
  const e = curList()[active];
  showLoading(`Requesting ${doc} from the customer…`);
  try{
    const res = await fetch(API + "/api/mock-customer-db/request-document", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({shipment_id: e.shipment_id, document_type: doc}),
    });
    const data = await res.json();
    if (!data.found){
      $("side").innerHTML = sideHead() + `<div class="empty">${esc(data.message)}</div>`;
      return;
    }
    e.attachments.push({filename: data.attachment.filename, path: null, size_kb: 2, kind: doc});
    attText[data.attachment.filename] = data.attachment.content_text;
    renderMail();
    toast(`${doc} received — re-processing.`);
    await runShipSync(true);
  }catch(err){
    $("side").innerHTML = sideHead() + `<div class="empty">Request failed: ${esc(err.message)}</div>`;
  }
}

/* ---------------------------------------------------------- side panel */
function sideHead(){
  return `<div class="shead"><div class="smark">S</div>
    <div><b>ShipSync</b><span>Side panel · live from the API</span></div></div>`;
}
function showLoading(msg){
  $("side").innerHTML = sideHead() + `<div class="empty"><span class="spin"></span> ${esc(msg)}</div>`;
}
function renderIdle(){
  const e = curList()[active];
  $("side").innerHTML = sideHead() + `
    <div class="panel"><h3>Shipment</h3>
      <div class="ship"><span class="id">${esc(e.shipment_id || "—")}</span>
        <span class="pill mute">${esc((e._real && e._status) ? e._status : "NOT PROCESSED")}</span></div>
      <div class="kv"><span>From</span><b>${esc(e.from_name)}</b>
        <span>Attachments</span><b>${e.attachments.length || "none"}</b></div></div>
    <div class="panel"><h3>Action</h3>
      <p style="margin:0 0 12px;color:var(--muted-2);font-size:12.5px;line-height:1.55">
        This email has not been sent through ShipSync yet. Processing runs once and
        the result is stored for the Dashboard.</p>
      <div class="btns"><button class="btn primary" onclick="runShipSync(false)">Run ShipSync</button></div></div>`;
}

function renderSide(r){
  const e = curList()[active];
  const st = r.status;
  const cls = st === "OK" ? "ok" : st === "MISMATCH" ? "bad" : st === "NEEDS_REVIEW" ? "warn" : "mute";
  const v = r.verification || {};
  const missing = r.missing_documents || [];

  $("side").innerHTML = sideHead() + `
    <div class="panel">
      <h3>Shipment</h3>
      <div class="ship"><span class="id">${esc(r.shipment_id || e.shipment_id || "—")}</span>
        <span class="pill ${cls}">${esc(st)}</span></div>
      <div class="kv">
        <span>Doc type</span><b>${esc(docTypes(r))}</b>
        <span>Category</span><b>${esc(r.category)}</b>
        <span>Action</span><b>${esc(r.suggested_action || "—")}</b>
      </div>
    </div>
    <div class="panel"><h3>Documents</h3>${docs(r, missing)}</div>
    <div class="panel"><h3>Extracted fields</h3>${fields(r)}</div>
    <div class="panel"><h3>Verification</h3>${verify(r, v, missing)}</div>
    <div class="panel"><h3>Required actions</h3>${actions(r, missing)}</div>
    <div class="panel" style="border-bottom:0">
      <div class="src">${esc(r.cached
        ? "Stored result — reused, pipeline NOT re-run."
        : "Freshly processed by the ShipSync core.")}
        <br>Processing time <b>${esc(r.cached ? "0 ms (cached)" : Math.round(r.processing_ms||0) + " ms")}</b>
        · run <b>#${esc(r.attempts || 1)}</b>
        ${r.processed_at ? `<br>Stored at <b>${esc(String(r.processed_at).replace("T"," ").slice(0,19))}</b>` : ""}
      </div>
    </div>`;
}

function docTypes(r){
  const t = [...new Set((r.documents||[]).map(d => d.type))];
  return t.length ? t.join(" + ") : "none";
}
function docs(r, missing){
  const rows = (r.documents || []).map(d => {
    const miss = d.status === "missing";
    const ok = !miss && d.type !== "UNKNOWN";
    return `<div class="doc">
      <div class="l"><b>${miss ? "✗" : ok ? "✓" : "•"} ${esc(d.type)}</b>
        <small>${esc(d.filename || "not received")}${d.version ? " · " + esc(d.version) : ""}</small></div>
      <div class="r ${miss ? "miss" : ok ? "good" : "dim"}">${miss ? "MISSING" : esc(d.status)}</div>
    </div>`;
  }).join("");
  return rows || `<div class="dim" style="font-size:12.5px">No shipping documents detected.</div>`;
}
function fields(r){
  const entries = Object.entries(r.extracted_fields || {});
  if (!entries.length) return `<div class="dim" style="font-size:12.5px">No comparable fields yet.</div>`;
  return `<table>${entries.map(([k, v]) => `
    <tr><td>${esc(label(k))}</td><td class="val">SI: ${esc(v.si ?? "—")}<br>BL: ${esc(v.bl ?? "—")}</td></tr>`).join("")}</table>`;
}
function verify(r, v, missing){
  const rows = v.field_results || [];
  if (!rows.length){
    if (missing.length) return `<div class="note">Missing document(s): ${esc(missing.join(", "))}.
      Cross-document verification starts once both sides exist.</div>`;
    return `<div class="dim" style="font-size:12.5px">No SI/BL pair to verify.</div>`;
  }
  const bad = (r.defect_fields || []).length;
  const poss = (r.possible_fields || []).length;
  const head = bad ? `<div class="note bad">${bad} field(s) mismatch — do not release the BL.</div>`
    : poss ? `<div class="note warn">⚠ ${poss} field(s) possible match (OCR noise) — review required.</div>`
    : (r.status === "OK" ? `<div class="note">All scored fields match.</div>` : "");
  return head + `<table>${rows.map(fr => `
    <tr><td>${esc(label(fr.field))}</td>
      <td class="${fr.match === true ? "good" : fr.match === "POSSIBLE" ? "poss" : fr.match === false ? "bad-tx" : "miss"}">
        ${fr.match === true ? "✓ Match" : fr.match === "POSSIBLE" ? "⚠ Possible (review)" : fr.match === false ? "⚠ Mismatch" : "? Undecidable"}
      </td></tr>`).join("")}</table>`;
}
function actions(r, missing){
  const out = [];
  if (missing.length){
    const doc = missing[0];
    out.push(`<div class="note">⚠ ${esc(doc)} is missing.</div>`);
    out.push(`<button class="btn primary" onclick="requestDoc('${esc(doc)}')">Request ${esc(doc)}</button>`);
  }
  if (r.status === "MISMATCH") out.push(`<button class="btn" onclick="openDashboard()">Open mismatch in Dashboard</button>`);
  if (r.status === "NEEDS_REVIEW") out.push(`<button class="btn" onclick="openDashboard()">Open review in Dashboard</button>`);
  out.push(`<button class="btn" onclick="runShipSync(true)">Re-process (explicit)</button>`);
  return `<div class="btns">${out.join("")}</div>`;
}

function openDashboard(){ window.open("/ui/", "_blank", "noopener"); }

/* ----------------------------------------------------------- theme + init */
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", cur);
  try{ localStorage.setItem("sdoc-theme", cur); }catch(_){}
}
$("q").addEventListener("input", renderList);
$("themeBtn").addEventListener("click", toggleTheme);
$("ssLaunch").addEventListener("click", () => {
  clearTimeout(shipSyncClickTimer);
  shipSyncClickTimer = setTimeout(() => { toggleShipSyncPanel(); shipSyncClickTimer = null; }, 180);
});
$("ssLaunch").addEventListener("dblclick", () => {
  clearTimeout(shipSyncClickTimer); shipSyncClickTimer = null; setPanelOpen(false); openDashboard();
});
window.runShipSync = runShipSync;
window.requestDoc = requestDoc;
window.previewAtt = previewAtt;
window.openDashboard = openDashboard;
window.connectGmail = connectGmail;
window.syncGmail = syncGmail;
window.switchSource = switchSource;
boot();
</script>
