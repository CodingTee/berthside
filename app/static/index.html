<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDOC Review Desk</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --border:#e3e8ef; --text:#1a2332; --muted:#64748b;
  --accent:#2563eb; --accent-soft:#eff6ff;
  --ok:#16a34a; --ok-bg:#f0fdf4; --mismatch:#dc2626; --mismatch-bg:#fef2f2;
  --review:#d97706; --review-bg:#fffbeb; --chip:#eef2f7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:650;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:12.5px}
header .spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
main{display:grid;grid-template-columns:430px 1fr;gap:18px;padding:18px 28px;height:calc(100vh - 58px)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-head input[type=text]{flex:1;min-width:120px;border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:13px;outline:none}
.panel-head input[type=text]:focus{border-color:var(--accent)}
select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;background:#fff;outline:none;cursor:pointer}
.list{overflow-y:auto;flex:1}
.row{padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.row:hover{background:var(--accent-soft)}
.row.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .subj{font-weight:550;font-size:13.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.3px}
.b-BL_COMPARISON{background:#ede9fe;color:#6d28d9}
.b-SI_REQUEST{background:#dbeafe;color:#1d4ed8}
.b-INVOICE_QUERY{background:#fce7f3;color:#be185d}
.b-GENERAL{background:var(--chip);color:#475569}
.b-SPAM{background:#fee2e2;color:#b91c1c}
.b-OK{background:var(--ok-bg);color:var(--ok)}
.b-MISMATCH{background:var(--mismatch-bg);color:var(--mismatch)}
.b-NEEDS_REVIEW{background:var(--review-bg);color:var(--review)}
.b-human{background:#ecfdf5;color:#047857;border:1px dashed #6ee7b7}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.detail{overflow-y:auto;flex:1;padding:0}
.detail-head{padding:16px 22px;border-bottom:1px solid var(--border)}
.detail-head h2{font-size:15.5px;margin:6px 0 8px;line-height:1.4}
.kv{font-size:12.5px;color:var(--muted);margin:2px 0}
.kv b{color:var(--text);font-weight:600}
section{padding:16px 22px;border-bottom:1px solid var(--border)}
section h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
pre.body{white-space:pre-wrap;font-size:12.3px;line-height:1.55;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;max-height:220px;overflow-y:auto;font-family:inherit}
table.cmp{width:100%;border-collapse:collapse;font-size:12.8px}
table.cmp th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:7px 10px;border-bottom:2px solid var(--border)}
table.cmp td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr.match td{background:var(--ok-bg)}
tr.diff td{background:var(--mismatch-bg)}
tr.miss td{background:var(--review-bg)}
td.f{font-weight:600;white-space:nowrap}
.val{font-family:Consolas,Menlo,monospace;font-size:12px;word-break:break-all}
.arrow{color:var(--muted);padding:0 4px}
.review-box{background:var(--review-bg);border:1px solid #fde68a;border-radius:10px;padding:14px 16px;margin-top:4px}
.review-box .why{font-size:12.8px;margin-bottom:10px}
.review-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.status-sel{padding:6px 8px}
input.note{flex:1;min-width:140px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
.ocr-doc{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fafcff}
.ocr-doc-name{font-weight:600;font-size:12.5px;margin-bottom:6px}
.ocr-doc-name .conf{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.ocr-field{font-size:12.5px;padding:2px 0;font-family:Consolas,Menlo,monospace}
.ocr-field b{font-family:"Segoe UI",sans-serif;color:var(--muted)}
details summary{cursor:pointer;font-size:11.5px;color:var(--muted);margin-top:6px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>📦 SDOC Review Desk</h1>
  <span class="sub">Shipping document verification · SI vs draft BL</span>
  <span class="spacer"></span>
  <a class="btn" href="/api/submission" download>⬇ submission.json</a>
</header>
<main>
  <div class="panel">
    <div class="panel-head">
      <input type="text" id="q" placeholder="Search subject / sender / id…">
      <select id="f-cat"><option value="">All categories</option></select>
      <select id="f-status">
        <option value="">All statuses</option>
        <option>NEEDS_REVIEW</option><option>MISMATCH</option><option>OK</option>
      </select>
    </div>
    <div class="list" id="list"><div class="empty"><span class="spin"></span> loading inbox…</div></div>
  </div>
  <div>
    <div class="stats" id="stats"></div>
    <div class="panel">
      <div class="detail" id="detail"><div class="empty">Select an email from the inbox.</div></div>
    </div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
let state = {items:[], active:null, summary:null};
const CATEGORIES = ["BL_COMPARISON","SI_REQUEST","INVOICE_QUERY","GENERAL","SPAM"];
const FIELDS = ["shipper","consignee","notify_party","port_of_loading","port_of_discharge","container_count","gross_weight_kg"];
$("#f-cat").innerHTML = '<option value="">All categories</option>' + CATEGORIES.map(c=>`<option>${c}</option>`).join("");

function badge(txt){return `<span class="badge b-${txt}">${txt}</span>`;}
function esc(s){return (s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

async function loadSummary(){
  state.summary = await (await fetch("/api/summary")).json();
  const s = state.summary;
  $("#stats").innerHTML = `
    <div class="stat"><div class="n">${s.total}</div><div class="l">Emails processed</div></div>
    <div class="stat"><div class="n">${s.by_status.MISMATCH||0}</div><div class="l">Mismatches flagged</div></div>
    <div class="stat"><div class="n">${s.by_status.NEEDS_REVIEW||0}</div><div class="l">Escalated for review</div></div>
    <div class="stat"><div class="n">${s.reviewed}</div><div class="l">Human reviews recorded</div></div>`;
}
async function loadList(){
  const cat=$("#f-cat").value, st=$("#f-status").value, q=$("#q").value.trim();
  const params = new URLSearchParams({limit:500});
  if(cat) params.set("category",cat); if(st) params.set("status",st); if(q) params.set("q",q);
  const data = await (await fetch("/api/emails?"+params)).json();
  state.items = data.items;
  $("#list").innerHTML = data.items.length ? data.items.map(r=>`
    <div class="row ${r.email_id===state.active?'active':''}" onclick="openEmail('${r.email_id}')">
      <div class="subj">${esc(r.subject)}</div>
      <div class="meta">${badge(r.category)} ${badge(r.status)}
        ${r.decided_by==='human'?'<span class="badge b-human">HUMAN</span>':''}
        <span>${esc(r.email_id)}</span><span>📎${r.n_attachments}</span>
      </div>
    </div>`).join("") : '<div class="empty">No emails match the filters.</div>';
}
async function openEmail(id){
  state.active = id;
  document.querySelectorAll(".row").forEach((el,i)=>el.classList.toggle("active", state.items[i]?.email_id===id));
  const d = await (await fetch("/api/emails/"+id)).json();
  renderDetail(d);
}
function renderDetail(d){
  const e=d.email, r=d.result;
  let cmp = "";
  if(d.comparisons){
    const rows = d.comparisons.map(c=>{
      const cls = c.missing?"miss":(c.match?"match":"diff");
      const mark = c.missing?"⚠️ missing":(c.match?"✅":"❌ differs");
      return `<tr class="${cls}"><td class="f">${c.field.replace(/_/g," ")}</td>
        <td class="val">${esc(c.si_value ?? "—")}</td><td class="arrow">→</td>
        <td class="val">${esc(c.bl_value ?? "—")}</td><td>${mark}</td></tr>`;
    }).join("");
    cmp = `<section><h3>SI → draft BL · field comparison</h3>
      <table class="cmp"><tr><th>Field</th><th>SI</th><th></th><th>draft BL</th><th>Verdict</th></tr>${rows}</table></section>`;
  }
  let review = "";
  if(r.status==="NEEDS_REVIEW" || r.status==="MISMATCH" || d.human_review){
    const hr = d.human_review;
    review = `<section><h3>Human review</h3><div class="review-box">
      ${r.status==="NEEDS_REVIEW"?`<div class="why"><b>Escalation reason:</b> ${esc(r.review_reason||"—")}</div>`:""}
      ${hr?`<div class="why">Recorded review: <b>${esc(hr.action)}</b>${hr.status?" → "+esc(hr.status):""}${hr.note?" · “"+esc(hr.note)+"”":""}</div>`:""}
      <div class="review-actions">
        <button class="btn primary" onclick="sendReview('${e.email_id}','confirm')">✓ Confirm machine verdict</button>
        <select class="status-sel" id="ov-status">
          <option value="">Override to…</option><option>OK</option><option>MISMATCH</option><option>NEEDS_REVIEW</option>
        </select>
        <input class="note" id="ov-note" placeholder="Reviewer note (optional)">
        <button class="btn" onclick="sendReview('${e.email_id}','override')">Apply override</button>
      </div></div></section>`;
  }
  let ocr = "";
  if(d.ocr_preview && d.ocr_preview.length){
    const blocks = d.ocr_preview.map(p=>{
      const rows = FIELDS.filter(f=>p.fields[f])
        .map(f=>`<div class="ocr-field"><b>${f.replace(/_/g," ")}:</b> ${esc(p.fields[f])}</div>`).join("")
        || '<div class="ocr-field">no fields recognized</div>';
      return `<div class="ocr-doc"><div class="ocr-doc-name">${esc(p.rel_path.split("/").pop())}<span class="conf">OCR confidence ${(p.avg_conf*100).toFixed(0)}%</span></div>${rows}<details><summary>raw OCR text</summary><pre class="body">${esc(p.text)}</pre></details></div>`;
    }).join("");
    ocr = `<section><h3>Local OCR preview (verdict unchanged · for reviewer reference)</h3>${blocks}</section>`;
  }
  $("#detail").innerHTML = `
    <div class="detail-head">
      <div>${badge(r.category)} ${badge(r.status)} ${r.decided_by==='human'?'<span class="badge b-human">HUMAN REVIEWED</span>':''}</div>
      <h2>${esc(e.subject)}</h2>
      <div class="kv"><b>From:</b> ${esc(e.from)} &nbsp;·&nbsp; <b>ID:</b> ${esc(e.email_id)}</div>
      <div class="kv"><b>Attachments:</b> ${e.attachments.length?e.attachments.map(a=>`<a href="/api/attachments/${esc(a)}" target="_blank">${esc(a.split("/").pop())}</a>`).join(" · "):"none"}</div>
      <div class="kv"><b>Verdict:</b> ${r.has_defect?`defect in ${r.defect_fields.map(f=>`<b>${f}</b>`).join(", ")}`:(r.status==="OK"?"no mismatch detected":esc(r.review_reason||""))}
        &nbsp;·&nbsp; decided by <b>${r.decided_by}</b>${r.rule&&r.decided_by!=="human"?` (rule: ${esc(r.rule)})`:""}</div>
    </div>
    ${cmp}
    ${ocr}
    ${review}
    <section><h3>Email body</h3><pre class="body">${esc(e.body)}</pre></section>`;
}
async function sendReview(id, action){
  const body = {action};
  if(action==="override"){
    body.status = $("#ov-status").value;
    if(!body.status){alert("Pick a status to override to.");return;}
    body.note = $("#ov-note").value;
  }
  await fetch(`/api/emails/${id}/review`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  await loadSummary(); await loadList(); openEmail(id);
}
let deb; $("#q").addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(loadList,250);});
$("#f-cat").addEventListener("change",loadList);
$("#f-status").addEventListener("change",loadList);
loadSummary().then(loadList);
</script>
</body>
</html>
